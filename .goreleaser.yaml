# GoReleaser config for the `midnight` developer CLI.
#
# This file ONLY builds the developer-facing `midnight` binary (cmd/midnight).
# Operator binaries (midnight-server, midnight-agent, etc.) are released
# through a separate pipeline because they ship with sealed credentials and
# host installers.
#
# Archives are published as GitHub Release assets by release.yml. The release
# workflow derives npm packages, a Homebrew formula, and a Scoop manifest from
# these exact verified archives, then signs their checksum manifests with
# Sigstore. Cross-repository publication remains opt-in and operator-owned.
version: 2

project_name: midnight-cli

before:
  hooks:
    # Release builds must be reproducible from the checked-in module graph.
    # Never rewrite go.mod/go.sum as part of packaging.
    - go test ./cmd/midnight/...
    - go test ./internal/version
    - ./packaging/release/generate-cli-completions.sh packaging/release/generated

builds:
  - id: midnight
    main: ./cmd/midnight
    binary: midnight
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/midnight/midnight/internal/version.Version={{.Version}}
      - -X github.com/midnight/midnight/internal/version.Commit={{.ShortCommit}}
      - -X github.com/midnight/midnight/internal/version.Date={{.Date}}

archives:
  - id: midnight
    ids:
      - midnight
    name_template: "midnight_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: LICENSE
        dst: LICENSE
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: README.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: cmd/midnight/README.md
        dst: README-midnight.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: packaging/release/generated/*
        dst: completions
        strip_parent: true
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: "midnight_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "Merge pull request"

# Package-channel generation and publication intentionally live in
# release.yml plus tools/distribution-manifests. Keeping GoReleaser focused on
# native archives prevents a second binary producer and avoids the Pro-only npm
# publisher's install-time download script.
