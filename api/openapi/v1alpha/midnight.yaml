          description: Exact five-field UTC cron expression with a minimum five-minute cadence. Required only when runtime_kind is cron.
        cron_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
        cron_max_attempts:
          type: integer
          minimum: 1
          maximum: 10
        cron_retry_delay_seconds:
