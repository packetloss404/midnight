openapi: 3.1.2
info:
  title: Midnight API
  version: v1alpha
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: >
    Authoritative v1alpha REST contract for the currently supported Midnight
    control-plane surface. Midnight is Railway-inspired, but this is not a
    Railway-compatible or drop-in API. This embedded file is the canonical
    served contract.
