  /services/{service_id}/deployments/{deployment_id}/actions/{action}:
    post:
      tags: ["Product","Deployments"]
      security:
        - BearerAuth: []
        - HumanSession: []
      summary: Queue a durable deployment action.
      description: >-
        Redeploy and rollback create a new canonical deployment by replaying
        the selected immutable image/config/variable snapshot without a build.
        Restart, stop, and remove create a separate durable runtime-action
        operation. The service/deployment relationship is resolved server-side.
        Human sessions are admitted only by the PostgreSQL coordinator that
        revalidates current session and typed action authority
        (`deployment.trigger.cli` for replay actions, `service.write` for
        runtime actions), actor/project/route-scoped idempotency, durable work,
        the exact response, and audit evidence in one serializable transaction.
      operationId: createDeploymentAction
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [redeploy, rollback, restart, stop, remove]
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The operation and outbox work were committed atomically.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"created":false,"deployment":{"active":false,"id":"id_demo","operation_id":"id_demo","operation_state":"QUEUED","service_id":"svc_demo","status":"QUEUED"},"operation":{"created_at":"2026-01-02T03:04:05Z","id":"id_demo","state":"QUEUED","updated_at":"2026-01-02T03:04:05Z"},"outbox_id":"id_demo"}
                $ref: '#/components/schemas/DeploymentActionResult'
        '400':
          description: Invalid action or idempotency key (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          description: The human session lacks deployment trigger authority (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deployment is not owned by the service (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Action conflicts with durable runtime/deployment state (`RESOURCE_CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Durable action intake failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Human-session authorization or coordinated action intake is unavailable (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
