          minimum: 1
    IdentityWorkspaceMemberUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, member, deployer, viewer]
    IdentityProjectMemberUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [owner, editor, viewer]
    IdentityInvitation:
      type: object
      description: >
        Non-secret invitation lifecycle metadata. This schema never contains
        the raw invitation credential or durable verifier material.
      required:
        - id
        - email
        - workspace_id
        - token_prefix
        - invited_by_user_id
        - created_at
        - updated_at
        - expires_at
        - resource_version
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^inv_'
        email:
          type: string
          format: email
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        workspace_role:
          type: string
          enum: [admin, member, deployer, viewer]
        project_role:
          type: string
          enum: [owner, editor, viewer]
        token_prefix:
          type: string
          description: Non-secret recognition prefix; not an invitation credential.
        invited_by_user_id:
          type: string
          pattern: '^usr_'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revoked_by_user_id:
          type: string
          pattern: '^usr_'
        revoked_reason:
          type: string
        accepted_at:
          type: string
          format: date-time
        accepted_by_user_id:
          type: string
          pattern: '^usr_'
        replaces_invitation_id:
          type: string
          pattern: '^inv_'
        resource_version:
          type: integer
          format: int64
          minimum: 1
    IdentityInvitationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityInvitation'
        next_cursor:
          type: string
          minLength: 1
          description: >
            Opaque signed continuation cursor. Omitted when there is no next
            page; clients must preserve the same invitation scope when resuming.
    IdentityInvitationCreateRequest:
      type: object
      description: >
        Grants exactly one workspace role or one direct-project role. A
        workspace invitation omits both project fields; a direct-project
        invitation supplies both `project_id` and `project_role`.
      required: [email, workspace_id, expires_at]
      additionalProperties: false
      oneOf:
        - required: [workspace_role]
          not:
            anyOf:
              - required: [project_id]
              - required: [project_role]
        - required: [project_id, project_role]
          not:
            required: [workspace_role]
      properties:
        email:
          type: string
          format: email
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        workspace_role:
          type: string
          enum: [admin, member, deployer, viewer]
        project_role:
          type: string
          enum: [owner, editor, viewer]
        expires_at:
          type: string
          format: date-time
          description: Fixed absolute expiry included in the idempotency fingerprint.
    IdentityInvitationReissueRequest:
      type: object
      description: >
        Exact scope of the invitation being replaced plus the fixed absolute
        expiry for the new credential. Email and role are inherited server-side.
      required: [workspace_id, expires_at]
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        expires_at:
          type: string
          format: date-time
          description: Fixed absolute expiry included in the idempotency fingerprint.
    IdentityInvitationAcceptRequest:
      type: object
      description: >
        The authenticated human principal supplies only the one-time invitation
        credential. The server derives the durable user ID and email.
      required: [invitation_token]
      additionalProperties: false
      properties:
        invitation_token:
          type: string
          pattern: '^midn_inv_'
          writeOnly: true
    IdentityInvitationCredentialResult:
      type: object
      description: >
        One-time credential response from create or reissue. Midnight does not
        send invitation email; the caller must deliver `invitation_token`
        manually through an appropriate secure channel. The raw credential is
        not recoverable from metadata list operations.
      required: [invitation_token, invitation]
      additionalProperties: false
      properties:
        invitation_token:
          type: string
          pattern: '^midn_inv_'
          writeOnly: true
          description: Raw invitation credential returned only on create/reissue or exact replay.
        invitation:
          $ref: '#/components/schemas/IdentityInvitation'
    Project:
      type: object
      required: [id, workspace_id, slug, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque project identifier (`prj_*`).
        workspace_id:
          type: string
          description: Explicit owning workspace identifier (`wrk_*`).
        slug:
          type: string
          description: RFC-1035 valid slug; unique per workspace.
          pattern: '^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$'
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TopologyLayoutNode:
