    Service:
      type: object
      required: [id, project_id, slug, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque service identifier (`svc_*`).
        project_id:
          type: string
          description: Owning project identifier (`prj_*`).
        slug:
          type: string
          pattern: '^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$'
        display_name:
          type: string
        resource_version:
          type: integer
          format: int64
          minimum: 1
          description: Strong validator echoed in ETag and required in If-Match on delete.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceDeletionReceipt:
      type: object
      required: [service_id, project_id, slug, deleted_at, removed, retained_deployments]
      description: >
        What one service delete actually removed. Counts are exact row counts,
        so a caller can tell the user what happened instead of guessing.
      properties:
        service_id:
          type: string
        project_id:
          type: string
        slug:
          type: string
        deleted_at:
          type: string
          format: date-time
        retained_deployments:
          type: integer
          description: Finished deployment records kept as readable history.
        removed:
          type: object
          required: [variables, volumes, published_domains, routes, tcp_proxies, environment_configs, source_links, pending_changes, monitors]
          properties:
            variables:
              type: integer
            volumes:
              type: integer
              description: Volumes soft-deleted with the standard reclaim grace window.
            published_domains:
              type: integer
            routes:
              type: integer
            tcp_proxies:
              type: integer
            environment_configs:
              type: integer
            source_links:
              type: integer
            pending_changes:
              type: integer
              description: Unapplied environment changeset items that named this service.
            monitors:
              type: integer
    CronOccurrence:
      type: object
      description: >
        Redaction-safe evidence for one automatic cron occurrence. It has no
        operation_id: scheduler execution is not a user-created Operation.
      required: [id, deployment_id, project_id, service_id, environment_id, due_at, snapshot_sha256, image, state, attempt, max_attempts, timeout_seconds]
      properties:
        id: {type: string}
        deployment_id: {type: string}
        project_id: {type: string}
        service_id: {type: string}
        environment_id: {type: string}
        due_at: {type: string, format: date-time}
        snapshot_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        image: {type: string, description: Immutable image reference recorded at cron activation.}
        state: {type: string, enum: [pending, running, retry_wait, succeeded, failed]}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        timeout_seconds: {type: integer, format: int64, minimum: 1}
        retry_at: {type: [string, 'null'], format: date-time}
        attempt_started_at: {type: [string, 'null'], format: date-time}
        container_name: {type: string, description: Retained deterministic one-off container name.}
        container_id: {type: string}
        exit_code: {type: [integer, 'null']}
        failure_code: {type: string, description: Empty unless the most recent attempt failed.}
        failure_message: {type: string, description: Redaction-safe terminal or retry failure summary.}
    ServiceEnvironmentConfig:
