        provider_delivery_id: {type: string}
        event_type: {type: string}
        event_id: {type: string}
        event_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 26214400
        state:
          $ref: '#/components/schemas/WebhookInboxState'
        route_attempt:
          type: integer
          minimum: 0
        max_route_attempts:
          type: integer
          minimum: 1
          maximum: 64
        manual_retries:
          type: integer
          minimum: 0
        reason_code: {type: string}
        last_error:
          type: string
          maxLength: 512
          description: Bounded and redacted diagnostic; never a raw payload.
        replay_count:
          type: integer
          format: int64
          minimum: 0
