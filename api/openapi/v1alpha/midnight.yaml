      properties:
        project_id:
          type: string
          pattern: '^prj_'
        user:
          $ref: '#/components/schemas/IdentityUser'
        role:
          type: string
          enum: [owner, editor, viewer]
        invited_by:
          type: string
          pattern: '^usr_'
        invited_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resource_version:
          type: integer
