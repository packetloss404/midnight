        - project_id
        - environment_id
        - service_id
        - schedule_kind
        - enabled
        - retention_seconds
        - next_run_at
        - resource_version
        - created_at
        - updated_at
      properties:
        id: {type: string}
        volume_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        schedule_kind:
          type: string
          enum: [daily, weekly, monthly]
        enabled: {type: boolean}
        retention_seconds: {type: integer, format: int64, minimum: 1}
        next_run_at: {type: string, format: date-time}
        last_run_at: {type: string, format: date-time}
        resource_version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VolumeBackupRun:
      type: object
      required: [id, volume_id, project_id, environment_id, service_id, trigger_kind, state, object_key, object_bytes, source_bytes, locked, created_at, updated_at]
      properties:
        id: {type: string}
        volume_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        policy_id: {type: string}
        trigger_kind:
          type: string
          enum: [manual, daily, weekly, monthly]
        state:
          type: string
          enum: [pending, running, succeeded, failed, deleted]
        object_key: {type: string}
        object_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        object_bytes: {type: integer, format: int64}
        source_bytes: {type: integer, format: int64}
        archive_format: {type: string}
        locked: {type: boolean}
        retention_until: {type: string, format: date-time}
        failure_code: {type: string}
        failure_detail: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VolumeBackupRunList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VolumeBackupRun'
    VolumeBackupAccepted:
      type: object
