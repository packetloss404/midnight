  /webhooks/inbound/{provider}/{endpoint_id}:
    post:
      tags: ["Operator","Webhooks"]
      security:
        - GitHubWebhookSignature: []
        - MidnightWebhookSignature: []
      summary: Receive an inbound source-control webhook delivery.
      description: Provider must be one of `github`, `gitlab-generic`, `bitbucket`, or `midnight-incoming`.
      operationId: receiveInboundWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, gitlab-generic, bitbucket, midnight-incoming]
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exact delivery identity and immutable envelope replayed; no synchronous redispatch occurs.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
            Midnight-Delivery-Id:
              schema:
                type: string
            Midnight-Inbox-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"example":"receiveInboundWebhook response"}
                type: object
                additionalProperties: true
        '202':
          description: Verified delivery payload committed to the durable inbox before acknowledgement.
          headers:
            Midnight-Delivery-Id:
              schema:
                type: string
            Midnight-Inbox-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"example":"receiveInboundWebhook response"}
                type: object
                additionalProperties: true
        '400':
          description: Invalid delivery.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Webhook signature verification failed (`WEBHOOK_SIGNATURE_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Only POST webhook deliveries are accepted (`WEBHOOK_METHOD_NOT_ALLOWED`).
          headers:
            Allow:
              schema:
                type: string
                enum: [POST]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Webhook endpoint is disabled (`WEBHOOK_ENDPOINT_DISABLED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Provider delivery identity was already committed with a different immutable envelope (`WEBHOOK_DELIVERY_IDENTITY_MISMATCH`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Signed payload exceeds the retained 25 MiB boundary (`WEBHOOK_BODY_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ephemeral memory-mode deduplication or synchronous dispatch failed (`WEBHOOK_DEDUPE_FAILED`, `WEBHOOK_DISPATCH_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Verified payload could not be committed to the durable inbox (`WEBHOOK_INBOX_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook-deliveries:
    get:
      summary: List metadata-only durable webhook delivery state.
      tags: ["Operator","Webhooks"]
      description: >
        Project-scoped view of bounded inbox metadata for a recovery operator
        or an authenticated human with exact project read access. Retained
        payloads, target dispatch payloads, signatures, key identifiers, and
        lease tokens are never returned.
      operationId: listWebhookDeliveries
      parameters:
        - name: project_id
          in: query
          required: true
          description: Exact server-enforced project projection.
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
            enum: [github, gitlab-generic, bitbucket, midnight-incoming]
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/WebhookInboxState'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Newest retained delivery metadata first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '400':
          description: Unsupported, duplicate, empty, or out-of-range filter (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human principal lacks exact project read access (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Durable inbox query failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable webhook inbox is not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook-deliveries/{delivery_id}:
    get:
      summary: Get one metadata-only durable webhook delivery and its targets.
