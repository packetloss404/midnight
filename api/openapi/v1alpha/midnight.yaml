  /operations/{id}/events:
    get:
      tags: ["Product","Operations"]
      security:
        - BearerAuth: []
        - HumanSession: []
        - ProjectAutomationToken: []
      summary: Stream operation lifecycle events from the operation event store.
      description: >
        Human sessions may read only operations joined through a canonical
        deployment to a currently authorized project and environment. Human
        live streams revalidate the session and grant before replayed and live
        events and periodically while idle; access loss closes the stream.
        Nonexistent and unauthorized operations are both concealed as 404.
      operationId: streamOperationEvents
      parameters:
        - $ref: '#/components/parameters/OperationID'
        - $ref: '#/components/parameters/OperationEventsAfter'
        - $ref: '#/components/parameters/OperationEventsStream'
        - $ref: '#/components/parameters/OperationEventsLastEventID'
      responses:
        '200':
          description: >
            Server-sent events in deterministic sequence order. Every operation
            frame has `id: <seq>`. With `stream=sse`, durable events after
            `Last-Event-ID` (or `after`) are replayed before live follow and the
            connection closes after a terminal event. Without live follow, the
            response ends with a cursor event carrying `next_sequence`.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                lifecycle:
                  value: |
                    id: 1
                    event: operation
                    data: {"id":"op-1-1","operation_id":"op-1","seq":1,"state":"QUEUED","message":"queued","created_at":"2026-04-26T00:00:00Z"}

                    event: cursor
                    data: {"next_sequence":1}
        '400':
          description: Invalid event cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '404':
          description: Operation is absent or concealed from the current principal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Tenant operation authorization is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
