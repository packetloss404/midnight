        identifier, and version are derived by the server and cannot be
        supplied by the caller.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        scope:
          $ref: '#/components/schemas/VariableScope'
        value:
          type: string
          writeOnly: true
          description: >
