        single-node templates. Atomically creates the service, encrypted
        generated credentials, private-only runtime config, persistent volume,
        canonical deployment, operation, and deploy outbox intent. The returned
        state is queued; success requires an engine-native write, container
        replacement, marker read from the same volume, and cleanup of
        secret-bearing probe containers. This is self-managed single-host
        provisioning and does not claim managed HA.
