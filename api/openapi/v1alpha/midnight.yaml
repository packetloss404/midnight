    ProjectGitHubRepository:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - repository_id
        - repository_full_name
        - private
        - default_branch
      properties:
        installation_id:
          type: integer
          format: int64
          minimum: 1
        repository_id:
          type: integer
          format: int64
          minimum: 1
        repository_full_name:
          type: string
          minLength: 3
          description: Server-observed canonical `owner/name`.
        account_login:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        resource_version:
          type: integer
          format: int64
          minimum: 1
    ProjectGitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGitHubRepository'
    GitHubBranch:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    GitHubBranchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GitHubBranch'
    GitHubServiceSourceLink:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - repository_id
        - repository_full_name
        - branch
        - binding_state
        - repository_access_verified_at
        - updated_at
      description: >
        Canonical, redaction-safe relational source binding. `bound` proves
        persistence and current grant validation at mutation time; it does not
        prove a deployment was queued, built, or promoted.
      properties:
        installation_id:
          type: integer
          format: int64
          minimum: 1
        repository_id:
          type: integer
          format: int64
          minimum: 1
        repository_full_name:
          type: string
          minLength: 3
          description: Server-observed canonical `owner/name`.
        branch:
          type: string
          minLength: 1
          maxLength: 255
        binding_state:
          type: string
          const: bound
        repository_access_verified_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitHubServiceSourceLinkRequest:
      type: object
      additionalProperties: false
      required: [installation_id, repository_id, branch]
      properties:
        installation_id:
          type: integer
          format: int64
          minimum: 1
        repository_id:
          type: integer
          format: int64
          minimum: 1
        branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical branch name without a `refs/` prefix or whitespace/control characters.
    GitHubWorkspaceGrantReplaceRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, repository_ids]
      properties:
        workspace_id:
          type: string
          minLength: 1
        repository_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
    GitHubWorkspaceGrantRevokeRequest:
      type: object
      additionalProperties: false
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          minLength: 1
    GitHubWorkspaceGrant:
      type: object
      additionalProperties: false
      required: [workspace_id, installation, repositories]
      properties:
        workspace_id:
          type: string
        installation:
          $ref: '#/components/schemas/GitHubInstallation'
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGitHubRepository'
        unlinked_service_ids:
          type: array
          description: Service links removed atomically by a replacement or revocation.
          items:
            type: string
    GitHubInstallation:
      type: object
      required: [id, account]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        account:
          type: string
        target_type:
          type: string
        html_url:
          type: string
          format: uri
    GitHubSetupInitiation:
      type: object
      additionalProperties: false
      required: [install_url, expires_at]
      properties:
        install_url:
          type: string
          format: uri
          description: GitHub installation URL carrying opaque signed one-time state.
        expires_at:
          type: string
          format: date-time
    GitHubRepository:
      type: object
      required: [id, full_name, private, clone_url]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        private:
          type: boolean
        clone_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        default_branch:
          type: string
    EnvironmentReplicaSummary:
      type: object
      required: [desired, ready, running, health, evidence_at, truth_source]
      properties:
        desired: {type: integer, minimum: 1}
        ready: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        health:
          type: string
          enum: [healthy, degraded, progressing, unhealthy, stopped, removed]
        evidence_at: {type: string, format: date-time}
        truth_source:
          type: string
          enum: [deployment-instances]
    EnvironmentDeploymentSummary:
      type: object
      required: [id, status, active, truth_source]
      properties:
        id: {type: string}
        status: {type: string}
        active: {type: boolean}
        image: {type: string}
        action: {type: string}
        source_type: {type: string}
        source_repository: {type: string}
        source_ref: {type: string}
        commit_sha: {type: string}
        root_directory: {type: string}
        dockerfile_path: {type: string}
        builder: {type: string}
        runtime_desired_state:
          type: string
          enum: [running, stopped, removed]
        runtime_observed_state:
          type: string
          enum: [unknown, running, stopped, removed]
        runtime_generation: {type: integer, format: int64, minimum: 1}
        replicas: {$ref: '#/components/schemas/EnvironmentReplicaSummary'}
        truth_source:
          type: string
          enum: [canonical, legacy-operation]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        operation:
          type: object
          required: [id, state]
          properties:
            id: {type: string}
            state: {$ref: '#/components/schemas/OperationState'}
            failure_code: {type: string}
            failure_reason: {type: string}
    EnvironmentResourceSummary:
      type: object
      required: [schema_version, project, environment, resources]
      properties:
        schema_version:
          type: string
          const: midnight.environment-resources/v1alpha1
        project:
          type: object
          required: [id, slug, display_name]
          properties:
            id: {type: string}
            slug: {type: string}
            display_name: {type: string}
        environment:
          type: object
          required: [id, project_id, slug, name, tier, is_protected]
          properties:
            id: {type: string}
            project_id: {type: string}
            slug: {type: string}
            name: {type: string}
            tier: {type: string}
            is_protected: {type: boolean}
        resources:
          type: array
          items:
            type: object
            required: [service, private_endpoint]
            properties:
              service:
                type: object
                required: [id, project_id, slug, display_name]
                properties:
                  id: {type: string}
                  project_id: {type: string}
                  slug: {type: string}
                  display_name: {type: string}
              latest_deployment:
                $ref: '#/components/schemas/EnvironmentDeploymentSummary'
              active_deployment:
                $ref: '#/components/schemas/EnvironmentDeploymentSummary'
              source:
                type: object
                required: [type, truth_source]
                properties:
                  type: {type: string}
                  repository: {type: string}
                  ref: {type: string}
                  revision: {type: string}
                  watch_paths:
                    type: array
                    items: {type: string}
                  root_directory: {type: string}
                  config_path: {type: string}
                  wait_for_ci: {type: boolean}
                  required_checks:
                    type: array
                    items: {type: string}
                  auto_deploy: {type: boolean}
                  verified_at: {type: string, format: date-time}
                  updated_at: {type: string, format: date-time}
                  truth_source:
                    type: string
                    enum: [canonical-github-link, canonical-source-link, canonical-deployment]
              endpoint:
                type: object
                required: [deployment_id, tls, evidence_at]
                properties:
                  deployment_id: {type: string}
                  host: {type: string}
                  url: {type: string, format: uri}
                  tls: {type: boolean}
                  evidence_at: {type: string, format: date-time}
              private_endpoint:
                type: object
                required: [host, truth_source]
                properties:
                  host: {type: string}
                  truth_source:
                    type: string
                    enum: [derived-service-dns]
    ProjectAutomationTokenProfile:
      type: string
      enum: [ci-deploy-v1]
      description: >
        Immutable server-owned capability profile. `ci-deploy-v1` is limited
        to the documented project discovery, deploy/up intake, deployment
        status, and canonical deployment-linked operation read routes. It
        conveys no operator, GraphQL, MCP, management, cancellation, or
        deployment-action authority.
    ProjectAutomationToken:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - workspace_id
        - project_id
        - name
        - token_prefix
        - profile
        - created_at
        - updated_at
        - expires_at
        - resource_version
      properties:
        id:
          type: string
          pattern: '^tok_'
        service_account_id:
          type: string
          pattern: '^sa_'
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        name:
          type: string
          minLength: 1
          maxLength: 128
        token_prefix:
          type: string
          pattern: '^midn_sa_'
          description: Non-secret recognition prefix; it cannot authenticate a request.
        profile:
          $ref: '#/components/schemas/ProjectAutomationTokenProfile'
        created_by_user_id:
          type: string
          pattern: '^usr_'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revoked_by_user_id:
          type: string
          pattern: '^usr_'
        revoked_reason:
          type: string
        resource_version:
          type: integer
          format: int64
          minimum: 1
    ProjectAutomationTokenList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAutomationToken'
    ProjectAutomationTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [name, expires_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expires_at:
          type: string
          format: date-time
          description: Required absolute expiry; it must be in the future.
    ProjectAutomationTokenCreateResult:
      type: object
      additionalProperties: false
      required: [access_token, token]
      properties:
        access_token:
          type: string
          pattern: '^midn_sa_[A-Za-z0-9_-]+$'
          readOnly: true
          description: Raw bearer returned exactly once; it is never listable or recoverable.
        token:
          $ref: '#/components/schemas/ProjectAutomationToken'
