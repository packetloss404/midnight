  /services/{id}/up:
    post:
      tags: ["Product","Services"]
      security:
        - BearerAuth: []
        - ProjectAutomationToken: []
        - HumanSession: []
      summary: Upload a local source archive and queue a canonical source deployment.
      description: >
        Accepts a bounded gzipped tar archive. Human sessions have a hard 50 MiB
        compressed maximum; MIDNIGHT_UP_BODY_LIMIT_BYTES may lower but cannot
        raise that maximum. A human request supplies an exact positive
        Content-Length and canonical X-Midnight-Archive-Digest. The API
        preflight authorizes and reserves the advertised logical bytes before
        the body is read, validates the complete archive, then reauthorizes and
        publishes the immutable blob under the quota/workspace/lifecycle lock
        order. The accepting SERIALIZABLE transaction commits the build
        operation, deployment, artifact ownership and workspace charge, outbox
        intent, idempotent response, and audit evidence. For human sessions,
        the API never extracts the archive; the build worker materializes an
        isolated checkout after outbox delivery. Retained logical quota
        exhaustion returns 413; temporary concurrent-upload backpressure
        returns 429 with Retry-After.
        Project automation tokens and recovery-operator credentials retain the
        legacy staged-extraction compatibility path and its separately
        configurable body-limit semantics until that independently authorized
        migration lands. A 202 response means queued, not deployed.
      operationId: createServiceUp
      parameters:
        - $ref: '#/components/parameters/PathID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Midnight-Environment
          in: header
          required: true
          description: Existing environment ID of at most 255 bytes that scopes the canonical deployment.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: X-Midnight-Commit-Message
          in: header
          required: false
          description: Optional printable UTF-8 label of at most 256 bytes, stored only with artifact ownership metadata; it is not placed in worker logs or the source URI.
          schema:
            type: string
            maxLength: 256
        - name: X-Midnight-Archive-Digest
          in: header
          required: false
          description: Required exactly once for HumanSession authentication. Canonical digest of the exact compressed request bytes; legacy compatibility authorities do not require it.
          schema:
            type: string
            pattern: '^sha256:[0-9a-f]{64}$'
        - name: Content-Length
          in: header
          required: false
          description: Required and positive for HumanSession authentication. It must exactly match the compressed request bytes; chunked human uploads are rejected.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              example: "H4sIAAAAAAAA"
              type: string
              format: binary
          application/x-gzip:
            schema:
              example: "H4sIAAAAAAAA"
              type: string
              format: binary
          application/x-tar+gzip:
            schema:
              example: "H4sIAAAAAAAA"
              type: string
              format: binary
          application/x-compressed-tar:
            schema:
              example: "H4sIAAAAAAAA"
              type: string
              format: binary
      responses:
        '202':
          description: Source archive accepted and its build queued.
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"deployment_id":"dep_demo","operation":{"created_at":"2026-01-02T03:04:05Z","id":"id_demo","state":"QUEUED","updated_at":"2026-01-02T03:04:05Z"},"operation_id":"id_demo"}
                $ref: '#/components/schemas/ServiceUpResponse'
        '400':
          description: Invalid archive, request header, environment scope, or idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Service or environment not found (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The current human grant lacks `deployment.trigger.cli` (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict, active upload reservation, or invalid/expired publication reservation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '411':
          description: A human-session request omitted an exact positive Content-Length or used transfer encoding.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Compressed request body exceeds its applicable limit, or retained human-session logical source quota is exhausted (`SOURCE_ARTIFACT_QUOTA_EXCEEDED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body is not a supported gzipped-tar media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workspace or installation-wide concurrent upload backpressure is exhausted (`SOURCE_ARTIFACT_UPLOAD_BACKPRESSURE`).
          headers:
            Retry-After:
              description: Minimum whole seconds before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Tenant authorization, artifact storage, or durable intake is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upload staging, canonical deployment creation, or build enqueue failed (`INTERNAL_ERROR`, `DEPLOY_JOB_ENQUEUE_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
