          description: Zero asks the server to apply its default.
        overlap_enabled:
          type: boolean
        drain_grace_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 3600
          description: Zero asks the server to apply its default.
        runtime_kind:
          type: string
          enum: [service, background, cron]
        cron_schedule:
          type: string
          description: Exact five-field UTC cron expression with a minimum five-minute cadence. Required when runtime_kind is cron.
        cron_timeout_seconds:
