          description: Exact server-enforced project projection.
          schema:
            type: string
      responses:
        '200':
          description: Durable delivery and target metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDetail'
        '400':
          description: Required project scope is missing, duplicate, or empty (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human principal lacks exact project read access (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Durable delivery does not exist (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Durable inbox query failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable webhook inbox is not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook-deliveries/{delivery_id}/redrive:
    post:
      summary: Atomically redrive one dead-letter webhook delivery.
      tags: ["Operator","Webhooks"]
      description: >
        Project-scoped mutation for a recovery operator or an authenticated
        human with exact deployment-trigger access, with an exactly empty
        body. Only a dead-letter delivery whose targets belong exclusively to
        the requested project and whose retained payloads pass integrity
        verification can be redriven. Ownership is revalidated under the same
        transaction lock as inbox state, exact idempotency response, and audit.
      operationId: redriveWebhookDelivery
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          required: true
          description: Exact project scope included in the idempotency fingerprint.
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Dead-letter delivery requeued for asynchronous planning or target dispatch.
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"available_at":"2026-01-02T03:04:05Z","endpoint_id":"id_demo","event_hash":"example-event-hash","event_type":"example-event-type","exclusive_project":true,"id":"id_demo","last_received_at":"2026-01-02T03:04:05Z","manual_retries":0,"max_route_attempts":1,"payload_bytes":0,"payload_sha256":"example-payload-sha256","provider":"github","provider_delivery_id":"id_demo","received_at":"2026-01-02T03:04:05Z","replay_count":0,"route_attempt":0,"state":"pending","targets":[{"attempt":0,"available_at":"2026-01-02T03:04:05Z","branch":"example-branch","commit_sha":"example-commit-sha","created_at":"2026-01-02T03:04:05Z","id":"id_demo","installation_grant_resource_version":1,"installation_id":1,"link_resource_version":1,"manual_retries":0,"max_attempts":1,"project_id":"prj_demo","repository":"example-repository","repository_grant_resource_version":1,"repository_id":1,"service_id":"svc_demo","state":"pending","target_key":"example-target-key","updated_at":"2026-01-02T03:04:05Z","workspace_id":"wrk_demo"}],"updated_at":"2026-01-02T03:04:05Z"}
                $ref: '#/components/schemas/WebhookDeliveryDetail'
        '400':
          description: Body or idempotency key is invalid (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Human principal lacks exact deployment-trigger access (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Durable delivery does not exist (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Delivery is not dead-lettered, includes a foreign or indeterminate project target, has unavailable/corrupt retained payload, or idempotency conflicts (`RESOURCE_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Atomic redrive failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Atomic durable webhook recovery is not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
