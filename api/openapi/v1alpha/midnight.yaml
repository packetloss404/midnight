        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Service or canonical GitHub source binding is absent or concealed (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GitHub source-link read failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
