        storage_driver: {type: string}
        live_restore: {type: boolean}
        logging_driver: {type: string}
        no_new_privileges: {type: boolean}
        cgroup_version: {type: string}
        baseline_conflicts:
          type: array
          items: {type: string}
    AgentStatusReport:
      type: object
      additionalProperties: false
      required: [agent_id, sequence, observed_at, hmac]
      properties:
        agent_id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 1
        observed_at:
          type: string
          format: date-time
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstanceStatus'
        route_targets:
          type: array
          items:
            $ref: '#/components/schemas/AgentRouteTargetObservation'
        drift:
          $ref: '#/components/schemas/AgentRuntimeDrift'
        hmac:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
    AgentStatusReportResponse:
      type: object
      additionalProperties: false
      required: [accepted_at]
      properties:
        accepted_at:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, project_id, slug, name, tier, is_protected, resource_version, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque environment identifier (`env_*`).
        project_id:
          type: string
          description: Owning project identifier (`prj_*`).
        slug:
          type: string
        name:
          type: string
        tier:
          type: string
        is_protected:
          type: boolean
        resource_version:
          type: integer
          format: int64
          minimum: 1
          description: Positive metadata version used by exact compare-and-swap updates.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvironmentChangesetCapability:
      type: object
      additionalProperties: false
      required: [kind, supported]
      properties:
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        supported: {type: boolean}
        reason: {type: string}
    EnvironmentChangesetItem:
      type: object
      additionalProperties: false
      required: [id, kind, operation, service_id, name, value_change]
      properties:
        id: {type: string}
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        operation: {type: string, enum: [add, edit, remove]}
        service_id: {type: string}
        target_id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [plain, secret, sealed]}
        expected_version: {type: integer, format: int64, minimum: 1}
        value_change:
          type: string
          description: Redaction-safe change description; variable plaintext is never returned.
        runtime: {$ref: '#/components/schemas/EnvironmentRuntimeSpec'}
        networking: {$ref: '#/components/schemas/EnvironmentNetworkingSpec'}
        storage: {$ref: '#/components/schemas/EnvironmentStorageSpec'}
    EnvironmentChangeset:
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, environment_id, created_by, state, revision, items, created_at, updated_at]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        created_by: {type: string}
        note: {type: string, maxLength: 500}
        state: {type: string, enum: [draft, applied, discarded]}
        revision: {type: integer, format: int64, minimum: 1}
        applied_revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic environment configuration revision assigned when this changeset applied.
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetItem'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        applied_at: {type: string, format: date-time}
        discarded_at: {type: string, format: date-time}
    EnvironmentChangesetValidation:
      type: object
      additionalProperties: false
      required: [valid, affected_services, affected_resources, errors, warnings]
      properties:
        valid: {type: boolean}
        affected_services: {type: array, items: {type: string}}
        affected_resources:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentAffectedResource'}
        errors: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
    EnvironmentAffectedResource:
      type: object
      additionalProperties: false
      required: [service_id, resource_kinds, requires_deploy, deployment_action]
      properties:
        service_id: {type: string}
        resource_kinds:
          type: array
          uniqueItems: true
          items: {type: string, enum: [variable, networking, runtime, storage]}
        requires_deploy:
          type: boolean
          example: true
          description: Server-derived deployment necessity; clients must not infer this from timestamps.
        deployment_action:
          type: string
          enum: [none, redeploy, rebuild]
          example: redeploy
          description: Server-derived highest-impact action for this service. Rebuild is selected only when normalized build inputs actually changed; redeploy reuses an immutable image; none requires no rollout.
    EnvironmentServiceConfigurationRevision:
      type: object
      additionalProperties: false
      required: [service_id, applied_revision, deployed_revision, deployment_required]
      properties:
        service_id: {type: string}
        applied_revision: {type: integer, format: int64, minimum: 0}
        deployed_revision: {type: integer, format: int64, minimum: 0}
        deployment_required: {type: boolean}
        deployed_deployment_id: {type: string}
        pending_deployment_id: {type: string}
    EnvironmentConfigurationState:
      type: object
      additionalProperties: false
      required: [applied_revision, services]
      properties:
        applied_revision: {type: integer, format: int64, minimum: 0}
        services:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentServiceConfigurationRevision'}
    EnvironmentChangesetView:
      type: object
      additionalProperties: false
      required: [validation, capabilities]
      properties:
        changeset:
          nullable: true
          allOf: [{$ref: '#/components/schemas/EnvironmentChangeset'}]
        validation: {$ref: '#/components/schemas/EnvironmentChangesetValidation'}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentChangesetCapability'}
        configuration_state: {$ref: '#/components/schemas/EnvironmentConfigurationState'}
    EnvironmentOperationGroupItem:
      type: object
      additionalProperties: false
      required: [service_id, resource_kinds, requires_deploy, deployment_action, intake_state]
      properties:
        service_id: {type: string}
        resource_kinds:
          type: array
          items: {type: string, enum: [variable, networking, runtime, storage]}
        requires_deploy: {type: boolean, example: true}
        deployment_action: {type: string, enum: [none, redeploy, rebuild], example: redeploy}
        intake_state: {type: string, enum: [not_required, queued, failed], example: queued}
        deployment_id: {type: string}
        operation_id: {type: string}
        operation_state: {$ref: '#/components/schemas/OperationState'}
        deployment_state:
          type: string
          enum: [queued, building, deploying, active, superseded, failed, canceled]
        failure_code: {type: string}
        failure_reason: {type: string}
    EnvironmentOperationGroup:
      type: object
      additionalProperties: false
      required: [id, environment_id, changeset_id, configuration_revision, state, items, created_at]
      properties:
        id: {type: string, pattern: '^opg_'}
        environment_id: {type: string}
        changeset_id: {type: string}
        configuration_revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [accepted, partial, running, succeeded, failed]}
        items:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentOperationGroupItem'}
        created_at: {type: string, format: date-time}
    EnvironmentApplyAndDeployResponse:
      type: object
      additionalProperties: false
      required: [applied_revision, operation_group_id, affected_services, changeset, validation, operation_group]
      properties:
        applied_revision: {type: integer, format: int64, minimum: 1}
        operation_group_id: {type: string, pattern: '^opg_'}
        affected_services: {type: array, items: {type: string}}
        changeset: {$ref: '#/components/schemas/EnvironmentChangeset'}
        validation: {$ref: '#/components/schemas/EnvironmentChangesetValidation'}
        operation_group: {$ref: '#/components/schemas/EnvironmentOperationGroup'}
    EnvironmentChangesetInput:
      type: object
      additionalProperties: false
      required: [kind, operation, service_id, name]
      properties:
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        operation: {type: string, enum: [add, edit, remove]}
        service_id: {type: string}
        target_id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [plain, secret, sealed]}
        expected_version: {type: integer, format: int64, minimum: 1}
        value:
          type: string
          writeOnly: true
          description: Encrypted before persistence and never returned.
        runtime: {$ref: '#/components/schemas/EnvironmentRuntimeSpec'}
        networking: {$ref: '#/components/schemas/EnvironmentNetworkingSpec'}
        storage: {$ref: '#/components/schemas/EnvironmentStorageSpec'}
    EnvironmentRuntimeSpec:
      type: object
      additionalProperties: false
      properties:
        root_directory: {type: string, maxLength: 1024}
        builder: {type: string, enum: [auto, dockerfile, railpack]}
        dockerfile_path: {type: string, maxLength: 1024}
        build_command: {type: string, maxLength: 32768}
        start_command: {type: string, maxLength: 32768}
        predeploy_command: {type: string, maxLength: 32768}
        target_port: {type: integer, minimum: 0, maximum: 65535}
        health_kind: {type: string, enum: [none, http, tcp]}
        health_path: {type: string, maxLength: 2048}
        health_port: {type: integer, minimum: 0, maximum: 65535}
        health_timeout_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
        health_interval_seconds: {type: integer, format: int64, minimum: 0, maximum: 86399}
        restart_policy: {type: string, enum: [no, always, unless-stopped, on-failure]}
        restart_retries: {type: integer, minimum: 0, maximum: 1000}
        replicas: {type: integer, minimum: 0, maximum: 50}
        overlap_enabled: {type: boolean}
        drain_grace_seconds: {type: integer, format: int64, minimum: 0, maximum: 3600}
        runtime_kind: {type: string, enum: [service, background, cron]}
        cron_schedule: {type: string}
        cron_timeout_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
        cron_max_attempts: {type: integer, minimum: 0, maximum: 10}
        cron_retry_delay_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
    EnvironmentNetworkingSpec:
      type: object
      additionalProperties: false
      required: [kind, public]
      properties:
        kind: {type: string, const: generated}
        public: {type: boolean, const: true}
    EnvironmentStorageSpec:
      type: object
      additionalProperties: false
      required: [size_bytes, mount_path]
      properties:
        size_bytes: {type: integer, format: int64, minimum: 0}
        mount_path: {type: string, pattern: '^/[^/].*'}
    PutEnvironmentChangesetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, changes]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        note: {type: string, maxLength: 500}
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetInput'}
    TransitionEnvironmentChangesetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
    ConfigSyncDocument:
      type: object
      additionalProperties: false
      required: [api_version, environment_id, expected_revision, changes]
      properties:
        api_version: {type: string, const: midnight/v1alpha}
        environment_id: {type: string}
        expected_revision: {type: integer, format: int64, minimum: 0}
        note: {type: string, maxLength: 500}
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetInput'}
    EnvironmentMutationRequest:
      type: object
      properties:
        project_id:
          type: string
        slug:
          type: string
          minLength: 1
        name:
          type: string
        tier:
          type: string
          enum: [production, staging, preview, development]
        is_protected:
          type: boolean
          description: >
            Shared operator lifecycle field. On `POST /environments`,
            HumanSession callers must omit this property or set it to `false`;
            `true` is rejected with 403 because protected creation is
            recovery-operator-only.
        copy_config:
          type: boolean
          description: >
            Transactionally copy per-service configuration, active encrypted
            variables, and immutable encrypted variable versions. Ciphertext is
            re-encrypted under fresh variable IDs; plaintext is never returned.
            Requires Idempotency-Key and the durable Postgres adapter.
        copy_domains:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; domain names and route publication must be created explicitly.
        copy_volumes:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; persistent data must be provisioned or restored explicitly.
        copy_deployments:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; history and running instances remain bound to the source environment.
    EnvironmentMetadataUpdateRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      anyOf:
        - required: [slug]
        - required: [name]
        - required: [tier]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
          description: Current `resource_version` returned by environment list or get.
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        tier:
          type: string
          enum: [production, staging, preview, development]
    EnvironmentDuplicateOmission:
      type: object
      required: [resource, count, reason]
      properties:
        resource:
          type: string
          enum: [domains, volumes, deployments]
        count:
          type: integer
          minimum: 0
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvironmentDuplicateResult:
      allOf:
        - $ref: '#/components/schemas/Environment'
        - type: object
          required:
            - copy_config
            - copied_service_configs
            - copied_variables
            - copied_variable_versions
            - omitted_resources
          properties:
            copy_config:
              type: boolean
              const: true
            copied_service_configs:
              type: integer
              minimum: 0
            copied_variables:
              type: integer
              minimum: 0
            copied_variable_versions:
              type: integer
              minimum: 0
            omitted_resources:
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentDuplicateOmission'
    TemplateSummary:
      type: object
      required: [slug, name, version, summary, provisionable]
      properties:
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        summary:
          type: string
        provisionable:
          type: boolean
          description: True only when this API instance has the durable runtime provisioner required to execute the template.
        capability_reason:
          type: string
          description: Redaction-safe reason the catalog entry cannot be provisioned on this API instance.
        tags:
          type: array
          items:
            type: string
    TemplateListResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSummary'
    CommunityTemplateDiscoverRequest:
      type: object
      additionalProperties: false
      required: [source, ref]
      properties:
        source:
          type: string
          pattern: '^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:[.]git)?/?$'
        ref:
          type: string
          pattern: '^[0-9a-f]{40}$'
    CommunityTemplateMetadata:
      type: object
      additionalProperties: false
      required: [maintainer, license, security_review, risk_class, update_policy, deprecation_policy, readme_path, sbom]
      properties:
        maintainer:
          type: string
        license:
          type: string
          description: SPDX license expression.
        security_review:
          type: string
          enum: [reviewed, unreviewed]
        risk_class:
          type: string
          enum: [low, moderate, high]
        update_policy:
          type: string
        deprecation_policy:
          type: string
        readme_path:
          type: string
        sbom:
          type: object
          additionalProperties: false
          required: [path, sha256]
          properties:
            path:
              type: string
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
    CommunityTemplateManifest:
      type: object
      additionalProperties: false
      required: [schema_version, template, metadata]
      properties:
        schema_version:
          type: integer
          const: 1
        template:
          $ref: '#/components/schemas/Template'
        metadata:
          $ref: '#/components/schemas/CommunityTemplateMetadata'
    CommunityTemplateProvenance:
      type: object
      readOnly: true
      required: [source, ref, manifest_path, manifest_sha256, readme_path, readme_sha256, sbom_path, sbom_sha256]
      properties:
        source:
          type: string
        ref:
          type: string
          pattern: '^[0-9a-f]{40}$'
        manifest_path:
          type: string
          const: template.yaml
        manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        readme_path:
          type: string
        readme_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sbom_path:
          type: string
        sbom_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CommunityTemplateValidationFinding:
      type: object
      required: [severity, code, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        path:
          type: string
        message:
          type: string
    CommunityTemplateDiscovery:
      type: object
      required: [trust_class, manifest, provenance, readme, findings, valid]
      properties:
        trust_class:
          type: string
          const: community
        manifest:
          $ref: '#/components/schemas/CommunityTemplateManifest'
        provenance:
          $ref: '#/components/schemas/CommunityTemplateProvenance'
        readme:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CommunityTemplateValidationFinding'
        valid:
          type: boolean
    CommunityTemplateForkCreateRequest:
      type: object
      additionalProperties: false
      required: [project_id, source, ref, expected_manifest_sha256]
      properties:
        project_id:
          type: string
        source:
          type: string
        ref:
          type: string
          pattern: '^[0-9a-f]{40}$'
        expected_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CommunityTemplateForkUpdateRequest:
      type: object
      additionalProperties: false
      required: [project_id, draft]
      properties:
        project_id:
          type: string
        draft:
          $ref: '#/components/schemas/CommunityTemplateManifest'
    CommunityTemplateChangesetRequest:
      type: object
      additionalProperties: false
      required: [project_id, environment_id, expected_revision, expected_fork_version, service_ids]
      properties:
        project_id: {type: string}
        environment_id: {type: string}
        expected_revision: {type: integer, format: int64, minimum: 0}
        expected_fork_version: {type: integer, format: int64, minimum: 1}
        service_ids:
          type: object
          minProperties: 1
          description: Exact template-service-slug to existing canonical service-ID mapping.
          additionalProperties: {type: string}
    CommunityTemplateFork:
      type: object
      required: [id, project_id, trust_class, upstream_manifest, draft, provenance, readme, findings, valid, resource_version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^tpl_[0-9a-f]{32}$'
        project_id:
          type: string
        trust_class:
          type: string
          const: local
        upstream_manifest:
          $ref: '#/components/schemas/CommunityTemplateManifest'
        draft:
          $ref: '#/components/schemas/CommunityTemplateManifest'
        provenance:
          $ref: '#/components/schemas/CommunityTemplateProvenance'
        readme:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CommunityTemplateValidationFinding'
        valid:
          type: boolean
        resource_version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Template:
      type: object
      required: [slug, name, version, summary, services]
      properties:
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        consumer_docs:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/TemplateService'
    TemplateService:
      type: object
      required: [slug, image]
      properties:
        slug:
          type: string
        image:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateEnvironmentValue'
        volume:
          $ref: '#/components/schemas/TemplateVolume'
        healthcheck:
          type: object
          required: [cmd]
          properties:
            cmd:
              type: string
        ports:
          type: array
          items:
            type: object
            required: [port]
            properties:
              port:
                type: integer
                minimum: 1
                maximum: 65535
              protocol:
                type: string
    TemplateEnvironmentValue:
      type: object
      required: [kind]
      description: >
        Declarative environment-value recipe. Generated secret values are
        described by generator metadata and are never returned as plaintext.
      properties:
        kind:
          type: string
          enum: [literal, generated, computed_url]
        value:
          type: string
        generated_kind:
          type: string
          enum: [password, uuid]
        length:
          type: integer
          minimum: 0
        template:
          type: string
        secret:
          type: boolean
    TemplateVolume:
      type: object
      required: [name, mount_path, size_bytes]
      properties:
        name:
          type: string
        mount_path:
          type: string
          pattern: '^/'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    TemplateDeployRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        name:
          type: string
    TemplateCreatedService:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
        slug:
          type: string
    TemplateCreatedResource:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [variable, volume]
        id:
          type: string
        name:
          type: string
    TemplateDeployResponse:
      type: object
      required:
        - operation_id
        - provision_run_id
        - template_slug
        - state
        - environment_id
        - deployment_id
        - created_services
        - status_url
      description: >
        Durable intake acknowledgement. `state=queued` is not database success;
        follow status_url until terminal.
      properties:
        operation_id:
          type: string
        provision_run_id:
          type: string
        template_slug:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        environment_id:
          type: string
        deployment_id:
          type: string
        created_services:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedService'
        created_variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedResource'
        created_volumes:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedResource'
        note:
          type: string
        status_url:
          type: string
    TemplateProvisionRun:
      type: object
      required:
        - id
        - template_slug
        - project_id
        - environment_id
        - service_id
        - volume_id
        - operation_id
        - deployment_id
        - state
        - connectivity_verified
        - persistence_verified
        - cleanup_completed
      properties:
        id:
          type: string
        template_slug:
          type: string
          enum: [postgres, redis, mysql, mongodb]
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        volume_id:
          type: string
        operation_id:
          type: string
        deployment_id:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        connectivity_verified:
          type: boolean
        persistence_verified:
          type: boolean
        cleanup_completed:
          type: boolean
        write_probe_container_id:
          type: string
        read_probe_container_id:
          type: string
        marker_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        failure_code:
          type: string
        failure_reason:
          type: string
          maxLength: 512
    DomainRoute:
      type: object
      required: [id, name, path_prefix, target_port, public]
      properties:
        id:
          type: string
        name:
          type: string
        path_prefix:
          type: string
          pattern: '^/'
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
        public:
          type: boolean
    DomainDNSChallenge:
      type: object
      required: [record_name, record_value, state, attempts]
      properties:
        record_name:
          type: string
        record_value:
          type: string
        state:
          type: string
          enum: [pending, verified, failed]
        attempts:
          type: integer
          format: int64
        last_error:
          type: string
        checked_at:
          type: string
          format: date-time
    DomainCertificate:
      type: object
      required: [issuer, state]
      properties:
        issuer:
          type: string
          description: "`unconfigured` until an operator wires a certificate issuer."
        state:
          type: string
          enum: [pending, issuing, ready, failed]
        expires_at:
          type: string
          format: date-time
        last_error:
          type: string
    Domain:
      type: object
      required: [id, project_id, environment_id, service_id, kind, hostname, tls_desired, tls_state, apply_state, reachable, routes, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        kind:
          type: string
          enum: [generated, custom]
        hostname:
          type: string
        tls_desired:
          type: boolean
        tls_state:
          type: string
          enum: [disabled, unavailable, ready]
        apply_state:
          type: string
          enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]
        reachable:
          type: boolean
          description: True only with durable Traefik acknowledgement and successful trusted-ingress probe evidence.
        artifact_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        error_code:
          type: string
        error_detail:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/DomainRoute'
        dns_challenge:
          $ref: '#/components/schemas/DomainDNSChallenge'
        certificate:
          $ref: '#/components/schemas/DomainCertificate'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDomainRequest:
      type: object
      required: [project_id, environment_id, service_id, kind, public, tls]
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        kind:
          type: string
          enum: [generated, custom]
        hostname:
          type: string
          description: Required for custom domains; omitted for generated domains.
        path_prefix:
          type: string
          default: /
          pattern: '^/'
        target_port:
          type: integer
          default: 8080
          minimum: 1
          maximum: 65535
        public:
          type: boolean
          default: false
        tls:
          type: boolean
          default: false
    TCPProxy:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - service_id
        - hostname
        - external_port
        - public_address
        - backend_port
        - allowed_source_cidrs
        - desired_enabled
        - apply_state
        - listener_bound
        - backend_reachable
        - dns_provisioned
        - public_reachability_verified
        - created_at
        - updated_at
      description: >
        Durable desired state plus single-host listener/backend evidence.
        DNS and public reachability are separate, operator-owned facts and are
        never inferred from an active local listener.
      properties:
        id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        hostname:
          type: string
        external_port:
          type: integer
          minimum: 1024
          maximum: 65535
        public_address:
          type: string
        backend_port:
          type: integer
          minimum: 1
          maximum: 65535
        allowed_source_cidrs:
          type: array
          description: >
            CIDRs matched against the peer address observed by the listener.
            An empty array means unrestricted/public. Docker bridge NAT may
            present a gateway address instead of the original client.
          items:
            type: string
        desired_enabled:
          type: boolean
        apply_state:
          type: string
          enum: [pending, active, withdrawn, failed]
        listener_bound:
          type: boolean
        backend_reachable:
          type: boolean
        dns_provisioned:
          type: boolean
          const: false
          description: DNS mutation is not part of the executable single-host slice.
        public_reachability_verified:
          type: boolean
          const: false
          description: External firewall/NAT and internet reachability are not probed.
        controller_id:
          type: string
        error_code:
          type: string
        error_detail:
          type: string
        observed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTCPProxyRequest:
      type: object
      required:
        - project_id
        - environment_id
        - service_id
        - backend_port
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        hostname:
          type: string
          description: Optional descriptive hostname. Omit to use the configured TCP base domain.
        external_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Optional port request; omit or use zero for collision-safe allocation.
        backend_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Internal port on the ready active deployment selected server-side.
        allowed_source_cidrs:
          type: array
          uniqueItems: true
          default: []
          description: >
            Optional CIDRs matched against the peer address observed by the
            listener. Omit or use an empty array for unrestricted/public TCP.
            Docker bridge NAT may replace the original client address.
          items:
            type: string
    Volume:
      type: object
      required: [id, project_id, environment_id, service_id, name, size_bytes, status, resource_version, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque volume identifier.
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [provisioning, ready, attached, restore_staged, restore_retained, soft_deleted, deleted]
        mount_path:
          type: string
          pattern: '^/'
        resource_version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateVolumeRequest:
      type: object
      required: [project_id, environment_id, service_id, name, size_bytes, mount_path]
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        name:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mount_path:
          type: string
          pattern: '^/'
    ResizeVolumeRequest:
      type: object
      required: [size_bytes]
