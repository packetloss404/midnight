            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Workspace or project is absent or concealed from the current user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            An active invitation already exists, the target is already a
            member, the request is in progress, or the idempotency key was
            reused with different content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Session, authorization, idempotency, audit, encryption, or invitation storage is unavailable.
