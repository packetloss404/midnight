x-source-contract: api/openapi/v1alpha/midnight.yaml
servers:
  - url: /api/v1alpha
    description: Same-origin v1alpha API root.
security:
  - BearerAuth: []
paths:
  /compat:
    get:
      security: []
      tags: ["Operator","Compatibility"]
      summary: Return server and component compatibility metadata.
      operationId: getCompat
      responses:
        '200':
          description: Compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
  /openapi.yaml:
    get:
      security: []
      tags: ["Operator","Contracts"]
      summary: Return this served OpenAPI contract.
      operationId: getOpenAPIContract
      responses:
        '200':
          description: OpenAPI YAML.
          content:
            application/yaml:
              schema:
                type: string
  /asyncapi.yaml:
    get:
      security: []
      tags: ["Operator","Contracts"]
      summary: Return the canonical event and outbound webhook contract.
      operationId: getAsyncAPIContract
      responses:
        '200':
          description: AsyncAPI YAML.
          content:
            application/yaml:
              schema:
                type: string
  /auth/claim:
    post:
      summary: Claim the migration default workspace and create its first human administrator.
      tags: ["Operator","Identity"]
      description: >
        One-shot operator-recovery operation. A valid TOTP enrollment secret
        and first code are required; password and TOTP material are never
        returned. The claimed owner becomes the first installation
        administrator; its human session can use the globally scoped console
        routes as well as the tenant-scoped product routes documented with
        `HumanSession`. Coordinated project
        and service creation, ordinary unprotected environment creation,
        tenant-safe service/environment configuration, narrow digest-pinned
        image deployment, and project automation-token and invitation
        management are enabled human mutations; other product mutations remain
        operator-only.
      operationId: claimDefaultWorkspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"display_name":"example-display-name","email":"operator@example.com","password":"example-password","totp_code":"example-totp-code","totp_secret":"redacted-example","workspace_display_name":"example-workspace-display-name","workspace_slug":"demo"}
              $ref: '#/components/schemas/IdentityClaimRequest'
      responses:
        '201':
          description: Default workspace claimed and administrator enrolled.
          content:
            application/json:
              schema:
                example: {"user":{"display_name":"example-display-name","email":"operator@example.com","id":"id_demo","instance_admin":true,"mfa_enabled":false},"workspace":{"created_at":"2026-01-02T03:04:05Z","display_name":"example-display-name","id":"id_demo","role":"admin","slug":"demo","updated_at":"2026-01-02T03:04:05Z"}}
                $ref: '#/components/schemas/IdentityClaimResult'
        '400':
          description: Invalid fields, TOTP enrollment proof, or idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Workspace already claimed or identity conflicts with existing state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request JSON exceeds the 64 KiB limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Tenant identity storage or durable human sessions are not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/claim/status:
    get:
      security: []
      tags: ["Operator","Identity"]
      summary: Report whether this installation already has a first administrator.
      description: >
        Unauthenticated first-run probe. The console must decide whether to
        render administrator setup before any credential exists, so this
        operation is deliberately anonymous. It returns a single boolean and no
        other detail: no email, no user count, and no workspace identity, so it
        cannot be used to enumerate tenants.
      operationId: getDefaultWorkspaceClaimStatus
      responses:
        '200':
          description: Claim status for the migration default workspace.
          content:
            application/json:
              schema:
                example: {"claimed":true}
                $ref: '#/components/schemas/IdentityClaimStatus'
        '503':
          description: Tenant identity storage is not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password-reset:
    post:
      summary: Reset an installation administrator's password and second factor.
      tags: ["Operator","Identity"]
      description: >
        Operator-recovery credential reset. `/auth/claim` is one-shot, so
        without this operation a lost or mistyped first-run password leaves a
        claimed installation unreachable by any human. It accepts only the
        installation recovery credential: a signed-in administrator session is
        refused with `AUTH_OPERATOR_RECOVERY_REQUIRED`, because rewriting
        another account's password and second factor is not a capability any
        human session should carry.


        The target must be an enabled, undeleted installation administrator;
        disabled and soft-deleted accounts are never resurrected by recovery.
        The second factor is never silently dropped: either supply a verified
        replacement enrollment (`totp_secret` plus its current `totp_code`,
        checked exactly the way `/auth/claim` checks a first enrollment), or set
        `preserve_totp` to keep the authenticator the account already has. A
        successful reset clears any pending password-rotation requirement,
        invalidates the account's session generation, and revokes every live
        session, so a stolen session cannot outlive the recovery. Password and
        TOTP material are never returned.
      operationId: resetAdministratorPassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"email":"operator@example.com","password":"example-password","totp_code":"example-totp-code","totp_secret":"redacted-example"}
              $ref: '#/components/schemas/IdentityPasswordResetRequest'
      responses:
        '200':
          description: Administrator credentials replaced and live sessions revoked.
          content:
            application/json:
              schema:
                example: {"sessions_revoked":1,"totp_reenrolled":true,"user":{"display_name":"example-display-name","email":"operator@example.com","id":"id_demo","instance_admin":true,"mfa_enabled":false}}
                $ref: '#/components/schemas/IdentityPasswordResetResult'
        '400':
          description: >
            Invalid fields, a password below the minimum length, a TOTP
            enrollment proof that did not verify, `preserve_totp` combined with
            replacement enrollment material, `preserve_totp` on an account that
            has no enrollment to preserve, or an invalid idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A human session presented; this route accepts only the operator recovery credential (`AUTH_OPERATOR_RECOVERY_REQUIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No enabled administrator account matches the address (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key reused with a different request or still in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request JSON exceeds the 64 KiB limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable administrator recovery is not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    post:
      security: []
      tags: ["Product","Identity"]
      summary: Create a durable human dashboard, CLI, or API session.
      operationId: createIdentitySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"email":"operator@example.com","password":"example-password"}
              $ref: '#/components/schemas/IdentityLoginRequest'
      responses:
        '201':
          description: Session created; the raw access token is returned once.
          content:
            application/json:
              schema:
                example: {"access_token":"redacted-example","expires_in":1,"session":{"client_kind":"dashboard","created_at":"2026-01-02T03:04:05Z","current":false,"expires_at":"2026-01-02T03:04:05Z","id":"id_demo","idle_expires_at":"2026-01-02T03:04:05Z","last_seen_at":"2026-01-02T03:04:05Z","token_prefix":"redacted-example","user_id":"id_demo"},"token_type":"Bearer","user":{"display_name":"example-display-name","email":"operator@example.com","id":"id_demo","instance_admin":true,"mfa_enabled":false}}
                $ref: '#/components/schemas/IdentityLoginResult'
        '400':
          description: Malformed login request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '413':
          description: Request JSON exceeds the 64 KiB limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Login verification budget exhausted (`AUTH_RATE_LIMITED`).
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable human sessions are not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: List the current user's durable sessions.
      operationId: listIdentitySessions
      responses:
        '200':
          description: Session metadata; raw bearer values are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentitySession'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '503':
          description: Durable human sessions are not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions/{session_id}:
    delete:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: Revoke one session belonging to the current user.
      operationId: revokeIdentitySession
      x-stability: alpha
      x-stability-reason: Session revocation has no authoritative item GET and atomic If-Match implementation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '404':
          description: Session is absent or belongs to another user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable human sessions are not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: Return the verified human principal and current session.
      operationId: getIdentityPrincipal
      responses:
        '200':
          description: Verified principal and current session metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMe'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '503':
          description: Durable human sessions are not configured (`CAPABILITY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    get:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: List workspaces in which the current user has accepted membership.
      operationId: listIdentityWorkspaces
      responses:
        '200':
          description: Tenant-scoped workspace list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityWorkspace'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
  /workspaces/{workspace_id}/members:
    get:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: List members of a workspace the current user administers.
      operationId: listIdentityWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Workspace member list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityWorkspaceMember'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Workspace is absent or concealed from the current user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspace_id}/members/{user_id}:
    get:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: Get one existing workspace membership.
      operationId: getIdentityWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Existing membership metadata.
          headers:
            ETag:
              description: Strong quoted membership resource version for If-Match.
              x-etag-strength: strong
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityWorkspaceMember'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Product","Identity"]
      security:
        - HumanSession: []
      summary: Change an existing workspace membership role.
      description: This endpoint does not invite or provision users.
      operationId: updateIdentityWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"role":"admin"}
              $ref: '#/components/schemas/IdentityWorkspaceMemberUpdate'
      responses:
        '200':
          description: Existing membership updated.
          headers:
            ETag:
              description: Strong quoted updated membership resource version.
              x-etag-strength: strong
              schema:
                type: string
