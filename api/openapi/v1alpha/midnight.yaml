components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: installation administrator bearer
      description: >
        Installation-administrator authentication for globally scoped product
        and control-plane APIs. Normal operation uses an expiring, revocable
        midn_user_* session whose current user has `instance_admin: true`.
        The separately configured operator-recovery credential remains a
        break-glass alternative and is required for the one-shot initial
        workspace claim. Arbitrary legacy operator strings and midn_admin_*
        remain recovery-compatible; midn_sa_*, midn_agent_*, and midn_mcp_*
        credentials are rejected.
      x-credential-class: installation-admin
    HumanSession:
      type: http
      scheme: bearer
      bearerFormat: midn_user_*
      description: >
        Expiring and revocable human dashboard/CLI session. It is accepted by
        identity and membership endpoints plus the explicitly documented
        tenant-scoped product routes. Coordinated project and service creation,
        ordinary unprotected environment creation, narrow digest-pinned image
        deployment, and project automation-token and invitation management are
        enabled human product mutations.
        Exact service/environment configuration reads and compare-and-swap
        writes are admitted through current `service.read`/`service.write`
        authority and the restricted-environment deny overlay.
        Exact service/environment variable metadata reads and encrypted
        create/rotate/tombstone operations require current `variables.read`/
        `variables.write` through the restricted-environment deny overlay.
        Values remain write-only, and saving desired state does not deploy or
        restart a workload.
        Project-scoped GitHub repository/branch discovery and canonical service
        source-link GET/PUT/DELETE are also admitted through current session,
        membership, capability, and exact workspace-grant checks. Canonical
        deployment and exact operation progress reads are enabled only through
        current tenant grants; global GitHub installation discovery, workspace
        grant recovery, and other control-plane routes remain unavailable to
        ordinary human sessions. A user with `instance_admin: true` may also
        use the globally secured `BearerAuth` operations with this same session.
      x-credential-class: human-session
    ProjectAutomationToken:
      type: http
      scheme: bearer
      bearerFormat: midn_sa_*
      description: >
        Expiring and revocable service-account credential bound to one
        canonical workspace and project. The server-owned `ci-deploy-v1`
        profile accepts only the operations that explicitly list this scheme:
        own-project discovery, deploy/up intake, deployment reads, and reads
        of operations linked to a canonical deployment in the same project.
        It is rejected by operator, management, GraphQL, MCP, cancellation,
        failure, configuration, variables, and deployment-action routes.
      x-credential-class: project-automation
    AgentCredential:
      type: http
      scheme: bearer
      bearerFormat: per-agent secret
      description: >
        Installation-managed credential scoped to exactly one runtime agent.
        For item routes, the credential must match the `{id}` path parameter;
        registration binds it to the `agent_id` request field. An optional
        `X-Midnight-Agent-ID` header must agree with that same identity.
        Operator recovery, human-session, and project-automation credentials
        are never accepted by these routes.
      x-credential-class: runtime-agent
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: >
        GitHub HMAC-SHA256 signature over the exact request body. This scheme
        applies only when the provider path parameter is `github`.
    MidnightWebhookSignature:
      type: apiKey
      in: header
      name: Midnight-Signature
      description: >
        Midnight timestamped HMAC signature (`t=<unix>,v1=<hex>,kid=<id>`)
        over the exact request body. This scheme applies to the non-GitHub
        inbound providers.
  responses:
    BadRequest:
      description: Request parameters or body are invalid (`RESOURCE_VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token (`AUTH_REQUIRED_MISSING`, `AUTH_TOKEN_HEADER_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HumanUnauthorized:
      description: Invalid credentials, missing MFA, or an invalid/expired/revoked human session (`AUTH_CREDENTIALS_INVALID`, `MFA_REQUIRED`, `MFA_INVALID_CODE`, `AUTH_SESSION_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProductUnauthorized:
      description: Missing/invalid operator or project-automation credential, or invalid/expired/revoked human session (`AUTH_REQUIRED_MISSING`, `AUTH_TOKEN_HEADER_INVALID`, `AUTH_SESSION_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated principal lacks the required capability (`AUTHORIZATION_DENIED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found (`RESOURCE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The supplied strong If-Match validator is stale, malformed, weak, or does not match the current resource (`PRECONDITION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A strong If-Match validator from the authoritative item GET is required (`PRECONDITION_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current state or idempotency history.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The proposed resource is understood but cannot be validated or executed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required durable authority or runtime dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag returned by the authoritative GET for this exact resource. Weak, malformed, stale, and wildcard validators are rejected.
