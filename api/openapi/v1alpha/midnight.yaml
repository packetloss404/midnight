    get:
      tags: ["Product","Operations"]
      security:
        - BearerAuth: []
        - HumanSession: []
        - ProjectAutomationToken: []
      summary: Report backed logs for an operation.
      description: >
        Truthful log status for deploy tooling. Deploy logs are backed by
        operation lifecycle events at `/operations/{id}/events`. Build,
        runtime, HTTP, and platform log surfaces return real structured log
        entries when a log store is configured; unbacked surfaces are marked
        unavailable with `LOG_STORE_UNAVAILABLE`. Human sessions require
        `logs.read` on the canonical deployment scope; nonexistent and
        unauthorized operations are both concealed as 404.
      operationId: getOperationLogs
      parameters:
        - $ref: '#/components/parameters/OperationID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Maximum structured log entries to return per surface.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive free-text filter over message and string fields.
        - name: surface
          in: query
          required: false
          schema:
            type: string
            enum: [build, runtime, http, platform]
          description: Surface whose `next_cursor` is being resumed. Required when `cursor` is set so per-surface cursors cannot skip other log streams.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Encrypted, authenticated, opaque cursor returned by a previous truncated surface page. Bound to the operation, surface, and text query; requires matching `surface` and `q`.
      responses:
        '200':
          description: Operation event availability plus app/platform log surface entries or availability status.
