  /operations/{id}/cancel:
    post:
      tags: ["Product","Operations"]
      security:
        - HumanSession: []
      summary: Cancel a queued or running operation.
      description: >-
        Human sessions may cancel only a canonical deployment operation for a
        currently authorized project and environment. The serializable
        coordinator revalidates `deployment.trigger.cli`, actor/project/route
        idempotency, operation/deployment lineage, outbox and queue fencing,
        the exact response, and audit evidence atomically. Work not yet leased
        is withdrawn and terminalized immediately. Leased build or deploy work
        receives a durable cancel request that workers honor at named safe
        points before traffic promotion; an in-progress BuildKit solve is not
        interrupted and is fenced before deploy handoff. The request body must
        be empty. Nonexistent and unauthorized lineage is concealed as 404.
      operationId: cancelOperation
      parameters:
        - $ref: '#/components/parameters/OperationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Operation canceled.
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"created_at":"2026-01-02T03:04:05Z","id":"id_demo","state":"QUEUED","updated_at":"2026-01-02T03:04:05Z"}
                $ref: '#/components/schemas/Operation'
        '400':
          description: Invalid body or idempotency key (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Operation is absent or concealed from the current principal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          description: The human session lacks deployment trigger authority (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Operation is terminal, has no cancelable durable work or worker safe point, or the idempotency key conflicts (`OPERATION_INVALID_TRANSITION`, `DEPLOY_CANCEL_UNSAFE`, `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The atomic cancellation transaction failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Tenant cancellation authority or durable dependencies are unavailable (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
