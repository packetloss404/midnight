  /environments:
    get:
      tags: ["Product","Environments"]
      security:
        - BearerAuth: []
        - HumanSession: []
        - ProjectAutomationToken: []
      summary: List environments visible to the verified product principal.
      description: >
        Operator recovery credentials retain the installation-wide view.
        Human sessions receive only environments allowed by their canonical
        project grants; restricted environments are concealed from non-admins.
      operationId: listEnvironments
      parameters:
        - name: project_id
          in: query
          required: false
          description: >
            Restrict the environment list to children of the named project.
            Exactly one project_id is required when authenticating with
            ProjectAutomationToken.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Environment list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '503':
          description: Human-session verification dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Environment list failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: ["Product","Environments"]
      security:
        - BearerAuth: []
        - HumanSession: []
      summary: Create one durable environment.
      description: >
        Operator recovery credentials retain the existing environment-create
        authority. A human session must have `environment.write` on the exact
        target project and may create only an ordinary unprotected
        environment: `is_protected` must be omitted or `false`. Human
        `is_protected: true` requests are rejected with 403; protected
        environment creation remains recovery-operator-only. The human
        admission does not authorize protected-state changes, delete,
        duplicate, or any other environment mutation. Session validity, current project
        authority, idempotency, environment state, the exact response, and
        audit evidence commit through the atomic PostgreSQL coordinator.
        Missing and cross-tenant projects are concealed as 404.
      operationId: createEnvironment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"copy_config":false,"copy_deployments":false,"copy_domains":false,"copy_volumes":false,"is_protected":false,"name":"demo","project_id":"prj_demo","slug":"demo","tier":"production"}
              $ref: '#/components/schemas/EnvironmentMutationRequest'
      responses:
        '201':
          description: Environment created.
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"created_at":"2026-01-02T03:04:05Z","id":"id_demo","is_protected":false,"name":"demo","project_id":"prj_demo","resource_version":1,"slug":"demo","tier":"example-tier","updated_at":"2026-01-02T03:04:05Z"}
                $ref: '#/components/schemas/Environment'
        '400':
          description: Validation failure (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_INVALID`, `IDEMPOTENCY_KEY_REQUIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          description: The human principal lacks `environment.write`, or requested protected environment creation, which remains recovery-operator-only (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The target project is absent or concealed from the human principal (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (`RESOURCE_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds the bounded environment-create limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Session, authorization, idempotency, audit, or environment storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /environments/{id}:
    get:
      tags: ["Product","Environments"]
      security:
        - BearerAuth: []
        - HumanSession: []
        - ProjectAutomationToken: []
      summary: Get an environment by ID.
      operationId: getEnvironment
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Environment.
          headers:
            ETag:
              description: Strong quoted environment resource version for If-Match.
              x-etag-strength: strong
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '404':
          description: Environment not found (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Human-session verification dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Environment lookup failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: ["Product","Environments"]
      security:
        - BearerAuth: []
        - HumanSession: []
      summary: Update environment metadata.
      description: >
        A durable human session may update only `slug`, `name`, and `tier` and
        must have current `environment.write` on the environment's canonical
        project. The human request is one strict non-null JSON object bounded to
        16 KiB, requires exactly one `Idempotency-Key`, and uses positive
        `expected_version` compare-and-swap. Session validity, current grants,
        restricted-environment policy, the metadata row, exact success or
        terminal conflict response, idempotency state, and audit evidence are
        serialized through one PostgreSQL transaction. Missing, cross-tenant,
        and restricted environments are concealed from non-admin humans as
        404. A recovery-operator bearer retains the legacy wider compatibility
        body, including its protected-state control; that compatibility does
        not grant HumanSession callers access to `is_protected`, project
        movement, deletion, duplication, configuration copy, or runtime
        changes. A successful PATCH changes control-plane metadata only and
        does not deploy, restart, or apply configuration to a workload.
      operationId: updateEnvironment
      parameters:
        - $ref: '#/components/parameters/PathID'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: >-
          HumanSession callers must use `EnvironmentMetadataUpdateRequest` and
          provide exactly one `Idempotency-Key`. BearerAuth is the
          recovery-operator compatibility path and uses
          `EnvironmentMutationRequest`; it does not require the header.
        content:
          application/json:
            schema:
              example: "updateEnvironment request"
              anyOf:
                - $ref: '#/components/schemas/EnvironmentMetadataUpdateRequest'
                - $ref: '#/components/schemas/EnvironmentMutationRequest'
      responses:
        '200':
          description: Updated environment.
          headers:
            Idempotent-Replayed:
              description: Set to `true` when the exact stored response was replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                example: {"created_at":"2026-01-02T03:04:05Z","id":"id_demo","is_protected":false,"name":"demo","project_id":"prj_demo","resource_version":1,"slug":"demo","tier":"example-tier","updated_at":"2026-01-02T03:04:05Z"}
                $ref: '#/components/schemas/Environment'
        '400':
          description: Validation or idempotency-key failure (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_INVALID`, `IDEMPOTENCY_KEY_REQUIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          description: The authenticated human principal lacks current `environment.write` (`AUTHORIZATION_DENIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The environment is absent, cross-tenant, or concealed by restricted-environment policy (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version, slug, or idempotency conflict (`RESOURCE_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          description: The human request body exceeds the 16 KiB limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          description: A legacy recovery-operator environment update failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Human session, authorization, idempotency, audit, or environment storage is unavailable (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Soft-delete an unprotected environment.
      tags: ["Product","Environments"]
      operationId: deleteEnvironment
      parameters:
        - $ref: '#/components/parameters/PathID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Environment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Environment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Protected environments cannot be deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /environments/{id}/duplicate:
    post:
      summary: Duplicate an environment within its project.
      tags: ["Product","Environments"]
      description: >
        Metadata-only duplication is available on every persistence adapter.
        With `copy_config=true`, the durable Postgres adapter creates the target
        environment, copies per-service configuration, and re-encrypts every
        active variable plus immutable variable version under fresh variable
        IDs in one transaction. `Idempotency-Key` is required in that mode.
        Domains, persistent volumes, deployment history, and running instances
        are never cloned implicitly; the response reports their source counts
        and why each class was omitted.
      operationId: duplicateEnvironment
      parameters:
        - $ref: '#/components/parameters/PathID'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"copy_config":false,"copy_deployments":false,"copy_domains":false,"copy_volumes":false,"is_protected":false,"name":"demo","project_id":"prj_demo","slug":"demo","tier":"production"}
              $ref: '#/components/schemas/EnvironmentMutationRequest'
      responses:
        '201':
          description: Duplicate created. Config-bearing responses include copy and omission counts.
          content:
            application/json:
              schema:
                example: {"created_at":"2026-01-02T03:04:05Z","id":"id_demo","is_protected":false,"name":"demo","project_id":"prj_demo","resource_version":1,"slug":"demo","tier":"example-tier","updated_at":"2026-01-02T03:04:05Z"}
                oneOf:
                  - $ref: '#/components/schemas/Environment'
                  - $ref: '#/components/schemas/EnvironmentDuplicateResult'
        '400':
          description: Invalid duplicate request, or missing Idempotency-Key for copy_config.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Source environment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Target slug already exists, source scope is inconsistent, or the Idempotency-Key conflicts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Config-bearing duplicate requested without a durable transactional copier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
