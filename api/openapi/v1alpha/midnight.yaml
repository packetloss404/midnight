                $ref: '#/components/schemas/GitHubServiceSourceLink'
        '400':
          description: Invalid JSON, identifier, branch, body size, or idempotency key (`RESOURCE_VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Service, repository grant, live repository, or branch is absent or concealed (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict or stale/mismatched repository authority (`IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`, `RESOURCE_CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the 16 KiB source-link limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub rejected or failed the repository-scoped verification.
