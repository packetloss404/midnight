          type: string
          format: date-time
          description: Immutable creation timestamp used with id as the operation-list keyset order.
        updated_at:
          type: string
          format: date-time
    ServiceUpResponse:
      type: object
      required: [operation_id, deployment_id, operation]
      description: >
        Queue acknowledgement. The deployment ID is canonical and
        server-minted; this response does not imply a successful build,
        runtime start, health check, or route publication.
      properties:
        operation_id:
          type: string
        deployment_id:
          type: string
        operation:
          $ref: '#/components/schemas/Operation'
        route:
          type: object
          properties:
            url:
              type: string
              format: uri
        replayed:
          type: boolean
    Deployment:
      type: object
      required: [id, service_id, operation_id, operation_state, status, active]
      properties:
        id:
          type: string
          description: Server-minted canonical deployment id; legacy reconstructed records may use the backing operation id.
        deployment_id:
          type: string
          description: Server-minted canonical deployment id when canonical deployment truth is available.
        service_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        instance_id:
          type: string
        image:
          type: string
        action:
          type: string
          description: Canonical durable deployment action.
        source_type:
          type: string
          description: Durable source provider or intake class reported by the deployment ledger.
        source_repository:
          type: string
          description: Non-secret repository or clone identity persisted with source intake.
        source_ref:
          type: string
          description: Durable source ref; GitHub webhook intake records the exact commit selected for checkout.
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: Commit proven by the build result or exact GitHub webhook source ref.
        trigger_actor_type:
          type: string
          enum: [provider_automation]
          description: Present only when the durable source proves an automation actor class.
        trigger_actor_label:
          type: string
          description: Support-safe label for a proven automation actor. Human actor identity is not inferred when absent from the deployment ledger.
        route_intent:
          type: string
          description: Generated hostname requested by this exact deployment. Intent alone is not reachability evidence.
        route:
          type: string
          format: uri
          description: Public-intent HTTP route URL. Current durable Traefik acknowledgement and a trusted ingress probe may verify local publication for this deployment, but public DNS and browser reachability remain unverified.
        route_apply_state:
          type: string
          enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]
          description: Durable environment route-group controller state. A blocked or failed value may reflect a sibling route rather than this deployment's bound generated route.
        route_reachable:
          type: boolean
          description: True only with a ready backend, current revision/hash, Traefik acknowledgement, and successful trusted Host-header ingress probe. This does not claim public DNS reachability.
        operation_id:
          type: string
        operation_state:
          $ref: '#/components/schemas/OperationState'
        status:
          type: string
          description: Uppercase values come from canonical deployment state; lowercase values are legacy operation-derived compatibility values.
          enum: [QUEUED, BUILDING, DEPLOYING, ACTIVE, SUPERSEDED, FAILED, CANCELED, queued, deploying, active, succeeded, failed, canceled, unknown]
        active:
          type: boolean
        runtime_desired_state:
          type: string
          enum: [running, stopped, removed]
          description: Durable desired state for this deployment's runtime instance.
        runtime_observed_state:
          type: string
          enum: [unknown, running, stopped, removed]
          description: Last runtime state observed after a durable action completed.
        runtime_generation:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing runtime-control generation.
        last_event:
          type: string
        last_event_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failure_code:
          type: string
          description: Typed failure code recorded on the backing deploy operation.
        failure_reason:
          type: string
          description: Operator-facing failure reason recorded on the backing deploy operation.
    DeploymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Deployment'
        next_cursor:
          type: string
          description: Opaque signed keyset cursor for the next page.
    PreviewEnvironmentCapabilityBlocker:
      type: object
      additionalProperties: false
