          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1
        last_rotated_at:
          type: string
          format: date-time
        length_bucket:
          type: string
          enum: [empty, 1-16, 17-64, 65-256, 257-1024, 1024+]
        kek_fingerprint:
          type: string
          minLength: 1
        value_kind:
