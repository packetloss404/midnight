        credentials retain the broader structured-source contract. Midnight
        mints the canonical deployment and candidate instance identifiers.
        Human admission revalidates the current session, role, environment
        restriction, service lineage, idempotency record, operation,
        deployment, generated route intent, outbox work, and audit evidence in
