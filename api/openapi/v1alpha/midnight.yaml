        Requires project-manage capability. Revocation is idempotent at the
        token lifecycle boundary, retains immutable attribution, and never
        returns raw bearer or verifier material.
      operationId: revokeProjectAutomationToken
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/AutomationTokenID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Automation token revoked, or the same revocation replayed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Idempotent-Replayed:
              schema:
                type: string
        '400':
          description: Invalid token identifier or idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/HumanUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project or token is absent or concealed from the current user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency request is in progress or the key was reused with a different request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          description: Session, authorization, idempotency, audit, encryption, or token storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
