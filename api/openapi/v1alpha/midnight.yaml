        promotion event is used only for non-human credentials. Human sessions
        receive canonical state from currently authorized project and
        environment scopes. Queued, building, deploying,
        completed-but-unpromoted, denied, or missing work returns
        `RESOURCE_NOT_FOUND`.
      operationId: getLatestActiveServiceDeployment
      parameters:
        - $ref: '#/components/parameters/PathID'
        - $ref: '#/components/parameters/DeploymentEnvironmentFilter'
      responses:
        '200':
          description: Latest active deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: Invalid or repeated environment filter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service or active deployment is absent or concealed (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '503':
          description: Tenant deployment authorization is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
