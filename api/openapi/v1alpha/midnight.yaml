        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        environment_id:
          type: string
          pattern: '^env_'
        nodes:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TopologyLayoutNode'
        resource_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectAccess:
      type: object
      required:
        - principal_kind
        - workspace_id
