    VolumeRestoreRun:
      type: object
      required: [id, backup_id, source_volume_id, project_id, environment_id, service_id, state, source_retained, attachment_swap_staged, restored_bytes, created_at, updated_at]
      properties:
        id: {type: string}
        backup_id: {type: string}
        source_volume_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        state:
          type: string
          enum: [pending, running, verified, staged, failed, applied]
        replacement_volume_id: {type: string}
        replacement_volume_name: {type: string}
        source_retained: {type: boolean}
        attachment_swap_staged: {type: boolean}
        restored_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        restored_bytes: {type: integer, format: int64}
        failure_code: {type: string}
        failure_detail: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VolumeRestoreRunList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VolumeRestoreRun'
    VolumeRestoreAccepted:
      type: object
      required: [run, job_id]
      properties:
        run:
          $ref: '#/components/schemas/VolumeRestoreRun'
        job_id: {type: string}
    VolumeRestoreApplyResult:
      type: object
      required: [restore, deployment_action, created]
      properties:
        restore:
          $ref: '#/components/schemas/VolumeRestoreRun'
        deployment_action:
          $ref: '#/components/schemas/DeploymentActionResult'
