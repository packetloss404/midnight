              $ref: '#/components/schemas/TemplateDeployRequest'
      responses:
        '202':
          description: Durable official-database provisioning saga queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"created_services":[{"id":"id_demo","slug":"demo"}],"deployment_id":"dep_demo","environment_id":"env_demo","operation_id":"id_demo","provision_run_id":"id_demo","state":"queued","status_url":"https://api.midnight.example/createTemplateInstance","template_slug":"demo"}
