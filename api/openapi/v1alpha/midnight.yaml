          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Product","GitHub"]
      security:
        - HumanSession: []
      summary: Create or replace a canonical GitHub source binding.
      description: >
        Requires both service-write and GitHub-deployment-trigger capability.
        The body accepts only numeric installation and repository identities
        plus one canonical branch. After local authorization, the server
        verifies the repository and branch through a repository-scoped GitHub
        token, then atomically reauthorizes, revalidates the exact workspace
        grant, persists the relational link, completes idempotency, and appends
        audit evidence. A `200` response means `bound`; it does not mean a
        deployment was queued or completed. CI-gate, path-filter, clone URL,
        and credential fields are not admitted by this route.
      operationId: putServiceGitHubSourceLink
      x-stability: alpha
      x-stability-reason: GitHub source-link replacement has no atomic version compare-and-swap implementation.
      parameters:
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
