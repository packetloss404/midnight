        still has running or in-flight deployment intent is refused with
        `SERVICE_DELETE_RUNNING`; stop the deployment through
        `POST /services/{service_id}/deployments/{deployment_id}/actions/stop`
        first. A service whose storage is still attached, whose pull-request
        preview is still open, or whose source upload has not finished is
        refused with `SERVICE_DELETE_BLOCKED`.


        Requires current `service.delete`, exactly one `Idempotency-Key`, and
        an `If-Match` carrying the strong service resource version returned by
        `GET /services/{id}`. Replay returns the stored response, including a
        stored refusal.
