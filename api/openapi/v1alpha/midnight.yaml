          format: int64
          minimum: 1
        repository_id:
          type: integer
          format: int64
          minimum: 1
        repository: {type: string}
        repository_grant_resource_version:
          type: integer
          format: int64
          minimum: 1
        link_resource_version:
          type: integer
          format: int64
          minimum: 1
        branch: {type: string}
