        last_received_at: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        routing_completed_at: {type: [string, 'null'], format: date-time}
        terminal_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
