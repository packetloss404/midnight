      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/EnvironmentID'
      responses:
        '200':
          description: Current topology layout, including the empty initial layout.
          headers:
            ETag:
              description: Strong quoted topology layout version; `"0"` identifies the empty initial state.
              x-etag-strength: strong
              schema:
                type: string
                pattern: '^"(0|[1-9][0-9]*)"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyLayout'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Tenant authorization or topology storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Product", "Projects"]
      security:
        - HumanSession: []
      summary: Replace the durable project-environment topology layout.
      description: >
        Replaces the bounded coordinate set using strong compare-and-swap. Use
        If-Match "0" for the first write. Every service ID is verified against
        the canonical project and locked against concurrent deletion before
        storage. The exact tenant grant must allow `project.manage`. This
        mutation changes presentation only and never deploys, restarts, or
        modifies runtime configuration.
      operationId: putTopologyLayout
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/EnvironmentID'
        - $ref: '#/components/parameters/TopologyIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutTopologyLayoutRequest'
            example: {"nodes":[{"service_id":"svc_demo","x":-100000,"y":-100000}]}
      responses:
        '200':
          description: Replaced topology layout.
          headers:
            ETag:
              description: Strong quoted replacement topology layout version.
              x-etag-strength: strong
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyLayout'
              example: {"environment_id":"env_demo","nodes":[{"service_id":"svc_demo","x":-100000,"y":-100000}],"project_id":"prj_demo","resource_version":0,"workspace_id":"wrk_demo"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ProductUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          description: Request body exceeds the JSON limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nodes are invalid or include a service outside the project.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          description: Tenant authorization, scope lookup, or topology storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
