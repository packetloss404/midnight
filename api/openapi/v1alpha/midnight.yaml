      description: >
        Creates an invitation granting exactly one role and returns the raw
        `midn_inv_*` credential only in this response or an exact idempotent
        replay. Midnight does not send invitation email; the caller must
        deliver the credential manually through an appropriate secure channel.
        `expires_at` is caller-fixed so exact retries have identical content.
      operationId: createIdentityInvitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: "createIdentityInvitation request"
              $ref: '#/components/schemas/IdentityInvitationCreateRequest'
      responses:
        '201':
          description: >
            Invitation created. `invitation_token` is a one-time credential
            response and is not available from list operations.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"invitation":{"created_at":"2026-01-02T03:04:05Z","email":"operator@example.com","expires_at":"2026-01-02T03:04:05Z","id":"id_demo","invited_by_user_id":"id_demo","resource_version":1,"token_prefix":"redacted-example","updated_at":"2026-01-02T03:04:05Z","workspace_id":"wrk_demo"},"invitation_token":"redacted-example"}
                $ref: '#/components/schemas/IdentityInvitationCredentialResult'
