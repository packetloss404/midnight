        - HumanSession: []
      summary: Read the durable project-environment topology layout.
      description: >
        Returns presentation-only service coordinates scoped to the exact
        project/environment lineage. A missing saved layout is represented by
        an empty node array with resource version zero. The response ETag is the
        strong validator required for replacement. Automation credentials are
        not admitted because a layout is an interactive user preference. The
        exact tenant grant must allow `project.read`; restricted scopes remain
        concealed.
