        - environment_restricted
        - permissions
      properties:
        principal_kind:
          type: string
          enum: [operator, developer, human]
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        environment_id:
          type: string
          pattern: '^env_'
        workspace_role:
          type: string
          enum: [admin, member, deployer, viewer]
        project_role:
          type: string
          enum: [owner, editor, viewer]
        environment_restricted:
