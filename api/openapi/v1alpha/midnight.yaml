      summary: Delete a service that is no longer running.
      description: >
        Removes the service together with the live intent it owns: its
        variables, its per-environment configuration, its published domains and
        HTTP routes, its TCP listeners, its persistent volumes, its repository
        link, and any unapplied environment changes that name it. Volumes are
        soft-deleted with the standard grace window so the reclaimer removes
        the backing directory; encrypted historical variable versions and the
        service's finished deployment records are kept as history.


