              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GitHub workspace-grant read failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable GitHub grant recovery storage is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Operator", "GitHub"]
      security:
        - BearerAuth: []
      summary: "Operator recovery: replace an installation's workspace grant."
      description: >
        Strictly accepts one workspace ID and a non-empty set of unique positive repository IDs. Before the serializable mutation, the server asks GitHub for the installation and each repository and persists only server-observed account, repository, clone, privacy, and default-branch metadata. One installation may belong to only one workspace. Repositories omitted from the replacement are revoked and their dependent service links are removed in the same transaction with idempotency and audit evidence.

      operationId: putGitHubInstallationWorkspaceGrant
      x-stability: alpha
      x-stability-reason: Workspace-grant replacement has no atomic version compare-and-swap implementation.
      parameters:
        - $ref: '#/components/parameters/GitHubInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"repository_ids": [1], "workspace_id": "wrk_demo"}
              $ref: '#/components/schemas/GitHubWorkspaceGrantReplaceRequest'
      responses:
        '200':
          description: Workspace grant replaced or replayed.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                example: {"installation": {"account": "example-account", "id": 1}, "repositories": [{"default_branch": "example-default-branch", "installation_id": 1, "private": false, "repository_full_name": "example-repository-full-name", "repository_id": 1}], "workspace_id": "wrk_demo"}
                $ref: '#/components/schemas/GitHubWorkspaceGrant'
        '400':
          description: Invalid strict JSON body, identifier set, body size, or idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workspace, GitHub installation, or repository not found (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Installation belongs to another workspace, idempotency is in progress, or the key was reused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the 64 KiB recovery limit (`RESOURCE_VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub rejected or failed installation/repository verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: GitHub workspace-grant replacement failed (`INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Durable grant, idempotency, audit, or GitHub verification is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: ["Operator", "GitHub"]
      security:
        - BearerAuth: []
      summary: "Operator recovery: revoke an installation's workspace grant."
      description: >
        Requires a strict workspace-only JSON body. The installation grant, every repository grant, dependent service links, idempotent response, and audit evidence are updated atomically.

      operationId: deleteGitHubInstallationWorkspaceGrant
      x-stability: alpha
      x-stability-reason: Workspace-grant deletion has no atomic version compare-and-swap implementation.
      parameters:
        - $ref: '#/components/parameters/GitHubInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
