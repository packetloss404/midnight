        Declarative environment-value recipe. Generated secret values are described by generator metadata and are never returned as plaintext.

      properties:
        kind:
          type: string
          enum: [literal, generated, computed_url]
        value:
          type: string
        generated_kind:
          type: string
          enum: [password, uuid]
        length:
          type: integer
          minimum: 0
        template:
          type: string
