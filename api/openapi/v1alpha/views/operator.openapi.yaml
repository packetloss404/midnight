        deployment_id: {type: string}
        replica_id: {type: string}
    Monitor:
      type: object
      required:
        - id
        - name
        - scope
        - signal
        - operator
        - threshold
        - window_seconds
        - evaluation_interval_seconds
        - consecutive_failures
        - consecutive_recoveries
        - enabled
        - state
        - failure_streak
        - recovery_streak
        - next_evaluation_at
      properties:
        id: {type: string}
        name: {type: string}
        scope:
          $ref: '#/components/schemas/MonitorScope'
        signal:
          type: string
          enum: [cpu_percent, memory_percent, restart_count]
        operator:
          type: string
          enum: [gt, gte]
        threshold:
          type: number
          minimum: 0
        window_seconds:
          type: integer
          minimum: 60
        evaluation_interval_seconds:
          type: integer
          minimum: 60
        consecutive_failures:
          type: integer
          minimum: 1
        consecutive_recoveries:
          type: integer
          minimum: 1
        enabled: {type: boolean}
        state:
          type: string
          enum: [unknown, healthy, firing]
        failure_streak:
          type: integer
          minimum: 0
        recovery_streak:
          type: integer
          minimum: 0
        next_evaluation_at:
          type: string
          format: date-time
        last_evaluated_at:
          type: string
          format: date-time
        last_value:
          type: number
    CreateMonitorRequest:
      type: object
      required:
        - project_id
        - environment_id
        - service_id
        - name
        - signal
        - operator
        - threshold
        - window_seconds
        - evaluation_interval_seconds
        - consecutive_failures
        - consecutive_recoveries
      properties:
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        name: {type: string, minLength: 1}
        signal:
          type: string
          enum: [cpu_percent, memory_percent, restart_count]
        operator:
          type: string
          enum: [gt, gte]
        threshold: {type: number, minimum: 0}
        window_seconds: {type: integer, minimum: 60}
        evaluation_interval_seconds: {type: integer, minimum: 60}
        consecutive_failures: {type: integer, minimum: 1}
        consecutive_recoveries: {type: integer, minimum: 1}
    MonitorChannel:
      type: object
      required:
        - id
        - project_id
        - display_name
        - type
        - endpoint_variable_id
        - signing_variable_id
        - signing_key_id
      description: Metadata-only channel. Endpoint and signing plaintext are never returned.
      properties:
        id: {type: string}
        project_id: {type: string}
        display_name: {type: string}
        type:
          type: string
          enum: [webhook]
        endpoint_variable_id: {type: string}
        signing_variable_id: {type: string}
        signing_key_id: {type: string}
    CreateMonitorChannelRequest:
      type: object
      required:
        - project_id
        - display_name
        - endpoint_variable_id
        - signing_variable_id
      properties:
        project_id: {type: string}
        display_name: {type: string, minLength: 1}
        endpoint_variable_id:
          type: string
          description: Sealed variable containing an HTTPS endpoint.
        signing_variable_id:
          type: string
          description: Sealed variable containing HMAC-SHA256 key material.
        signing_key_id: {type: string}
    CreateMonitorSubscriptionRequest:
      type: object
      required: [project_id, channel_id]
      properties:
        project_id: {type: string}
        channel_id: {type: string}
    MonitorSubscription:
      type: object
      required: [monitor_id, channel_id]
      properties:
        monitor_id: {type: string}
        channel_id: {type: string}
    MonitorIncident:
      type: object
      required:
        - id
        - monitor_id
        - monitor_name
        - scope
        - state
        - opened_at
        - delivery_count
        - dead_letter_count
      properties:
        id: {type: string}
        monitor_id: {type: string}
        monitor_name: {type: string}
        scope:
          $ref: '#/components/schemas/MonitorScope'
        state:
          type: string
          enum: [open, resolved]
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        open_value: {type: number}
        close_value: {type: number}
        delivery_count:
          type: integer
          minimum: 0
        dead_letter_count:
          type: integer
          minimum: 0
    MonitorDeliveryStatus:
      type: object
      required:
        - id
        - incident_id
        - monitor_id
        - monitor_name
        - project_id
        - environment_id
        - service_id
        - channel_id
        - channel_name
        - channel_type
        - event_type
        - state
        - attempts
        - manual_retries
        - available_at
        - created_at
        - updated_at
      description: >
        Metadata-only delivery status. Payloads, endpoints, secret/variable references, signing identifiers, lease ownership, and raw errors are intentionally absent.

      properties:
        id: {type: string}
        incident_id: {type: string}
        monitor_id: {type: string}
        monitor_name: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        channel_id: {type: string}
        channel_name: {type: string}
        channel_type:
          type: string
          enum: [webhook]
        event_type:
          type: string
          enum: [monitor.firing, monitor.resolved]
        state:
          type: string
          enum: [pending, leased, delivered, dead]
        attempts:
          type: integer
          minimum: 0
          maximum: 8
          description: Attempts in the current automatic delivery cycle.
        manual_retries:
          type: integer
          minimum: 0
        available_at:
          type: string
          format: date-time
        response_status:
          type: integer
          minimum: 100
          maximum: 599
        error_summary:
          type: string
          description: Fixed redacted category; never a raw transport error.
        delivered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RetryMonitorDeliveryRequest:
      type: object
      required: [project_id]
      additionalProperties: false
      properties:
        project_id:
          type: string
          minLength: 1
    WebhookInboxState:
      type: string
      enum: [pending, processing, retry_wait, succeeded, ignored, dead_letter]
    WebhookDeliverySummary:
      type: object
      description: >
        Metadata-only durable delivery projection. The verified payload, signature, signing-key identifier, lease token, and mismatch counter are deliberately absent.

      required:
        - id
        - provider
        - endpoint_id
        - provider_delivery_id
        - event_type
        - event_hash
        - payload_sha256
        - payload_bytes
        - state
        - route_attempt
        - max_route_attempts
        - manual_retries
        - replay_count
        - received_at
        - last_received_at
        - available_at
        - updated_at
      properties:
        id: {type: string}
        provider:
          type: string
          enum: [github, gitlab-generic, bitbucket, midnight-incoming]
        endpoint_id: {type: string}
        provider_delivery_id: {type: string}
        event_type: {type: string}
        event_id: {type: string}
        event_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 26214400
        state:
          $ref: '#/components/schemas/WebhookInboxState'
        route_attempt:
          type: integer
          minimum: 0
        max_route_attempts:
          type: integer
          minimum: 1
          maximum: 64
        manual_retries:
          type: integer
          minimum: 0
        reason_code: {type: string}
        last_error:
          type: string
          maxLength: 512
          description: Bounded and redacted diagnostic; never a raw payload.
        replay_count:
          type: integer
          format: int64
          minimum: 0
        received_at: {type: string, format: date-time}
        last_received_at: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        routing_completed_at: {type: [string, 'null'], format: date-time}
        terminal_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    WebhookDeliveryTarget:
      type: object
      description: >
        Queryable immutable target identity plus delivery state. The opaque dispatcher payload, authority timestamps, and lease token are absent.

      required:
        - id
        - target_key
        - workspace_id
        - project_id
        - service_id
        - installation_id
        - installation_grant_resource_version
        - repository_id
        - repository
        - repository_grant_resource_version
        - link_resource_version
        - branch
        - commit_sha
        - state
        - attempt
        - max_attempts
        - manual_retries
        - available_at
        - created_at
        - updated_at
      properties:
        id: {type: string}
        target_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
        workspace_id: {type: string}
        project_id: {type: string}
        service_id: {type: string}
        installation_id:
          type: integer
          format: int64
          minimum: 1
        installation_grant_resource_version:
          type: integer
          format: int64
          minimum: 1
        repository_id:
          type: integer
          format: int64
          minimum: 1
        repository: {type: string}
        repository_grant_resource_version:
          type: integer
          format: int64
          minimum: 1
        link_resource_version:
          type: integer
          format: int64
          minimum: 1
        branch: {type: string}
        commit_sha:
          type: string
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
        state:
          $ref: '#/components/schemas/WebhookInboxState'
        attempt:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
          maximum: 64
        manual_retries:
          type: integer
          minimum: 0
        reason_code: {type: string}
        last_error:
          type: string
          maxLength: 512
        operation_id: {type: string}
        deployment_id: {type: string}
        staged_outbox_id: {type: string}
        available_at: {type: string, format: date-time}
        terminal_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WebhookDeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/WebhookDeliverySummary'
        - type: object
          required: [targets, exclusive_project]
          properties:
            targets:
              type: array
              items:
                $ref: '#/components/schemas/WebhookDeliveryTarget'
            exclusive_project:
              type: boolean
              description: True only when every durable target belongs to the requested project; redrive requires true.
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliverySummary'
    Operation:
      type: object
      required: [id, state, created_at, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          $ref: '#/components/schemas/OperationState'
        code:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
          description: Immutable creation timestamp used with id as the operation-list keyset order.
        updated_at:
          type: string
          format: date-time
    ServiceUpResponse:
      type: object
      required: [operation_id, deployment_id, operation]
      description: >
        Queue acknowledgement. The deployment ID is canonical and server-minted; this response does not imply a successful build, runtime start, health check, or route publication.

      properties:
        operation_id:
          type: string
        deployment_id:
          type: string
        operation:
          $ref: '#/components/schemas/Operation'
        route:
          type: object
          properties:
            url:
              type: string
              format: uri
        replayed:
          type: boolean
    Deployment:
      type: object
      required: [id, service_id, operation_id, operation_state, status, active]
      properties:
        id:
          type: string
          description: Server-minted canonical deployment id; legacy reconstructed records may use the backing operation id.
        deployment_id:
          type: string
          description: Server-minted canonical deployment id when canonical deployment truth is available.
        service_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        instance_id:
          type: string
        image:
          type: string
        action:
          type: string
          description: Canonical durable deployment action.
        source_type:
          type: string
          description: Durable source provider or intake class reported by the deployment ledger.
        source_repository:
          type: string
          description: Non-secret repository or clone identity persisted with source intake.
        source_ref:
          type: string
          description: Durable source ref; GitHub webhook intake records the exact commit selected for checkout.
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: Commit proven by the build result or exact GitHub webhook source ref.
        trigger_actor_type:
          type: string
          enum: [provider_automation]
          description: Present only when the durable source proves an automation actor class.
        trigger_actor_label:
          type: string
          description: Support-safe label for a proven automation actor. Human actor identity is not inferred when absent from the deployment ledger.
        route_intent:
          type: string
          description: Generated hostname requested by this exact deployment. Intent alone is not reachability evidence.
        route:
          type: string
          format: uri
          description: Public-intent HTTP route URL. Current durable Traefik acknowledgement and a trusted ingress probe may verify local publication for this deployment, but public DNS and browser reachability remain unverified.
        route_apply_state:
          type: string
          enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]
          description: Durable environment route-group controller state. A blocked or failed value may reflect a sibling route rather than this deployment's bound generated route.
        route_reachable:
          type: boolean
          description: True only with a ready backend, current revision/hash, Traefik acknowledgement, and successful trusted Host-header ingress probe. This does not claim public DNS reachability.
        operation_id:
          type: string
        operation_state:
          $ref: '#/components/schemas/OperationState'
        status:
          type: string
          description: Uppercase values come from canonical deployment state; lowercase values are legacy operation-derived compatibility values.
          enum: [QUEUED, BUILDING, DEPLOYING, ACTIVE, SUPERSEDED, FAILED, CANCELED, queued, deploying, active, succeeded, failed, canceled, unknown]
        active:
          type: boolean
        runtime_desired_state:
          type: string
          enum: [running, stopped, removed]
          description: Durable desired state for this deployment's runtime instance.
        runtime_observed_state:
          type: string
          enum: [unknown, running, stopped, removed]
          description: Last runtime state observed after a durable action completed.
        runtime_generation:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing runtime-control generation.
        last_event:
          type: string
        last_event_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failure_code:
          type: string
          description: Typed failure code recorded on the backing deploy operation.
        failure_reason:
          type: string
          description: Operator-facing failure reason recorded on the backing deploy operation.
    DeploymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Deployment'
        next_cursor:
          type: string
          description: Opaque signed keyset cursor for the next page.
    PreviewEnvironmentCapabilityBlocker:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [pull_request_router_missing, durable_preview_mapping_missing, preview_isolation_missing, preview_cleanup_missing]
        detail:
          type: string
    PreviewEnvironmentLifecycleCapability:
      type: object
      additionalProperties: false
      required: [state, automatic_lifecycle, received_event, current_disposition, requested_actions, blockers]
      properties:
        state:
          type: string
          enum: [setup_required, enabled]
        automatic_lifecycle:
          type: boolean
        received_event:
          type: string
          const: pull_request
        current_disposition:
          type: string
          enum: [accepted_but_not_routed, routed]
        requested_actions:
          type: array
          items:
            type: string
            enum: ['opened:create', 'reopened:update', 'synchronize:update', 'closed:delete']
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/PreviewEnvironmentCapabilityBlocker'
    PreviewEnvironment:
      type: object
      additionalProperties: false
      required: [id, pull_request, environment_id, state, head_sha, from_fork, expires_at, updated_at]
      properties:
        id:
          type: string
        pull_request:
          type: integer
          minimum: 1
        environment_id:
          type: string
        deployment_id:
          type: string
        state:
          type: string
          enum: [creating, deploying, ready, refreshing, deleting, failed]
        url:
          type: string
          format: uri
        head_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        from_fork:
          type: boolean
        expires_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PreviewEnvironmentList:
      type: object
      additionalProperties: false
      required: [service_id, project_id, items, capability]
      properties:
        service_id:
          type: string
        project_id:
          type: string
        items:
          type: array
          maxItems: 100
          description: Durable, non-deleted pull-request previews for this exact service.
          items:
            $ref: '#/components/schemas/PreviewEnvironment'
        capability:
          $ref: '#/components/schemas/PreviewEnvironmentLifecycleCapability'
    DeployIntakeRequest:
      type: object
      description: |
        Either `image` (digest-pinned) or `source` (structured repo/ref) must be present.
        The legacy `source_ref` string field is retained for back-compat error reporting only and is permanently rejected with `DEPLOY_SOURCE_REF_UNSUPPORTED`.
      properties:
        environment_id:
          type: string
          description: Environment identifier for the deploy target.
        source_ref:
          type: string
          description: Legacy reserved string field. Always rejected with `DEPLOY_SOURCE_REF_UNSUPPORTED`; use the structured `source` object instead.
        source:
          $ref: '#/components/schemas/DeploySourceIntent'
        image:
          type: string
          description: Immutable digest-pinned image reference, for example `registry.example/web@sha256:<digest>`. Mutually exclusive with `source`.
          pattern: '^.+@sha256:[0-9a-f]{64}$'
        mode:
          type: string
          description: Optional deploy mode hint.
        deployment_id:
          type: string
          deprecated: true
          writeOnly: true
          description: Ignored compatibility field. Midnight always replaces it with a server-minted canonical deployment id.
        instance_id:
          type: string
          deprecated: true
          writeOnly: true
          description: Ignored compatibility field. Midnight derives the candidate instance id from the canonical deployment id.
        route:
          $ref: '#/components/schemas/DeployRouteIntent'
        previous_active:
          $ref: '#/components/schemas/DeployActiveInstanceRef'
    TenantImageDeployRequest:
      type: object
      additionalProperties: false
      required: [environment_id, image]
      description: >
        Human-session deployment intake. Only a target environment and an immutable image digest are required. The optional route object can only request one server-derived generated HTTP hostname. Source builds, custom hosts/paths/TLS, mode hints, and client-supplied deployment identity are not admitted by this capability.

      properties:
        environment_id:
          type: string
          minLength: 1
          description: Canonical environment identifier revalidated against the service project.
        image:
          type: string
          description: Immutable digest-pinned image reference.
          pattern: '^.+@sha256:[0-9a-f]{64}$'
        route:
          $ref: '#/components/schemas/TenantGeneratedRouteRequest'
    TenantGeneratedRouteRequest:
      type: object
      additionalProperties: false
      required: [public]
      description: Strict opt-in to one generated HTTP route. Omit this object for a private deployment.
      properties:
        public:
          type: boolean
          enum: [true]
    DeploySourceIntent:
      type: object
      additionalProperties: false
      required: [repo, ref]
      description: >
        Generic public-HTTPS source-build intent. GitHub App installation, repository, workspace, and link-version coordinates are reserved for Midnight's canonical signed-webhook intake and are rejected on this caller-supplied route.

      properties:
        provider:
          type: string
          enum: [git]
          description: Omit or use `git` for an ordinary public-host HTTPS checkout.
        repo:
          type: string
          format: uri
          pattern: '^https://'
          description: Canonical public-host HTTPS repository URL. Credentials, local paths, and private/loopback hosts are rejected.
        ref:
          type: string
          description: Git ref (branch, tag, or commit sha) to check out.
        subpath:
          type: string
          deprecated: true
          description: Deprecated compatibility spelling for root_directory.
        root_directory:
          type: string
          description: Optional relative path inside the checkout that the builder treats as the build context root.
        config_path:
          type: string
          description: Optional repository-relative platform configuration path retained separately from the build root.
    DeployRouteIntent:
      type: object
      description: >
        Existing-route selector for operator and project-automation deploys; fields never create hostname authority. A hostless public selector must resolve to exactly one eligible generated service binding. A host selector must resolve to an exact ownership-verified custom binding. Pending TLS or ownership evidence, missing matches, and ambiguous matches are rejected before accepted work. Human sessions use only route: {public: true} through the generated-domain product lifecycle.

      properties:
        name:
          type: string
          description: Optional exact authoritative route-name selector.
        group:
          type: string
          description: Optional exact authoritative route-group selector.
        host:
          type: string
          description: Optional exact already-owned custom-host selector; omit to select a generated binding.
        path:
          type: string
          pattern: '^/'
          description: Optional exact authoritative path selector.
        public:
          type: boolean
          default: false
          description: Explicit opt-in. A route object or hostname alone does not make a deployment public.
        tls:
          type: boolean
          description: Exact TLS-intent selector; true requires ready certificate evidence.
    DeployActiveInstanceRef:
      type: object
      deprecated: true
      description: >
        Ignored compatibility input on deploy intake. Midnight resolves the previous active canonical deployment from persisted state.

      properties:
        deployment_id:
          type: string
        instance_id:
          type: string
    OperationFailRequest:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    OperationEvent:
      type: object
      required: [id, operation_id, seq, state, created_at]
      properties:
        id:
          type: string
        operation_id:
          type: string
        seq:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/OperationState'
        message:
          type: string
        created_at:
          type: string
          format: date-time
    OperationEventsAvailability:
      type: object
      required: [available, kind, url, count]
      properties:
        available:
          type: boolean
        kind:
          type: string
          const: operation_events
        url:
          type: string
        count:
          type: integer
          minimum: 0
    LogCursor:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Encrypted and authenticated opaque resume cursor. Storage filenames and offsets are not exposed.
    LogEntry:
      type: object
      required: [at, level, component, message]
      properties:
        at:
          type: string
          format: date-time
        level:
          type: string
        component:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: true
    ObservabilityScope:
      type: object
      required: [project_id]
      properties:
        project_id: {type: string}
        environment_id: {type: string}
        service_id: {type: string}
        deployment_id: {type: string}
        operation_id: {type: string}
        replica_id: {type: string}
    ObservabilityLogRecord:
      type: object
      required: [observed_at, scope, surface, level, component, message]
      properties:
        observed_at: {type: string, format: date-time}
        scope:
          $ref: '#/components/schemas/ObservabilityScope'
        surface: {type: string, enum: [build, runtime, http, platform]}
        stream: {type: string, enum: ['', stdout, stderr, access]}
        level: {type: string}
        component: {type: string}
        message: {type: string, maxLength: 65536}
        attributes:
          type: object
          additionalProperties: true
    ObservabilityCollectorHealth:
      type: object
      required: [kind, status, heartbeat_gap]
      properties:
        kind:
          type: string
          enum: [docker, traefik]
        status:
