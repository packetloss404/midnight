          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workspace or installation grant not found (`RESOURCE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
