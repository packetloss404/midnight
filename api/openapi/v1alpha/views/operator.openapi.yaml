        action: {type: string}
        source_type: {type: string}
        source_repository: {type: string}
        source_ref: {type: string}
        commit_sha: {type: string}
        root_directory: {type: string}
        dockerfile_path: {type: string}
        builder: {type: string}
        runtime_desired_state:
          type: string
          enum: [running, stopped, removed]
        runtime_observed_state:
          type: string
          enum: [unknown, running, stopped, removed]
        runtime_generation: {type: integer, format: int64, minimum: 1}
        replicas: {$ref: '#/components/schemas/EnvironmentReplicaSummary'}
        truth_source:
          type: string
          enum: [canonical, legacy-operation]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
