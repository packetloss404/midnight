    IdentityUser:
      type: object
      required: [id, email, display_name, instance_admin, mfa_enabled]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^usr_'
        email:
          type: string
          format: email
        display_name:
          type: string
        instance_admin:
          type: boolean
          description: Whether this user may administer the whole Midnight installation.
        mfa_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
    IdentityPrincipal:
      type: object
      required: [kind, user_id, session_id, auth_method, email, display_name, instance_admin]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: user
        user_id:
          type: string
          pattern: '^usr_'
        session_id:
          type: string
          pattern: '^ses_'
        auth_method:
          type: string
          enum: [password, password+totp]
        email:
          type: string
          format: email
        display_name:
          type: string
        instance_admin:
          type: boolean
          description: Current installation-administrator authority, revalidated on every request.
    IdentitySession:
      type: object
      required: [id, user_id, token_prefix, client_kind, created_at, last_seen_at, expires_at, idle_expires_at, current]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ses_'
        user_id:
          type: string
          pattern: '^usr_'
        token_prefix:
          type: string
          description: Non-secret prefix suitable only for session recognition.
        client_kind:
          type: string
          enum: [dashboard, cli, api]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revoked_reason:
          type: string
        current:
          type: boolean
    IdentityLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        client_kind:
          type: string
          enum: [dashboard, cli, api]
    IdentityLoginResult:
      type: object
      required: [access_token, token_type, expires_in, user, session]
      additionalProperties: false
      properties:
        access_token:
          type: string
          pattern: '^midn_user_'
          writeOnly: true
          description: Raw bearer token returned exactly once.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
        user:
          $ref: '#/components/schemas/IdentityUser'
        session:
          $ref: '#/components/schemas/IdentitySession'
    IdentityMe:
      type: object
      required: [principal, session]
      additionalProperties: false
      properties:
        principal:
          $ref: '#/components/schemas/IdentityPrincipal'
        session:
          $ref: '#/components/schemas/IdentitySession'
    IdentityClaimRequest:
      type: object
      required: [email, display_name, password, totp_secret, totp_code, workspace_slug, workspace_display_name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 16
          writeOnly: true
        totp_secret:
          type: string
          minLength: 16
          writeOnly: true
          description: Base32 enrollment secret verified and encrypted before persistence.
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
        workspace_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        workspace_display_name:
          type: string
          minLength: 1
    IdentityClaimResult:
      type: object
      required: [user, workspace]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/IdentityUser'
        workspace:
          $ref: '#/components/schemas/IdentityWorkspace'
    IdentityClaimStatus:
      type: object
      required: [claimed]
      additionalProperties: false
      properties:
        claimed:
          type: boolean
          description: True once this installation has a first human administrator.
    IdentityPasswordResetRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Address of the enabled installation administrator to recover.
        password:
          type: string
          format: password
          minLength: 12
          writeOnly: true
        totp_secret:
          type: string
          minLength: 16
          writeOnly: true
          description: >
            Base32 replacement enrollment secret, verified and encrypted before persistence. Required unless preserve_totp is set.

        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: Current code for totp_secret, proving the authenticator is enrolled.
        preserve_totp:
          type: boolean
          default: false
          description: >
            Keep the account's existing TOTP enrollment and change only the password. It cannot be combined with replacement enrollment material, and it is refused when the account has no enrollment.

    IdentityPasswordResetResult:
      type: object
      required: [user, totp_reenrolled, sessions_revoked]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/IdentityUser'
        totp_reenrolled:
          type: boolean
          description: True when this reset installed a replacement second factor.
        sessions_revoked:
          type: integer
          minimum: 0
          description: Live sessions revoked by the reset.
    IdentityWorkspace:
      type: object
      required: [id, slug, display_name, role, created_at, updated_at]
      additionalProperties: false
      properties:
