    EnvironmentResourceSummary:
      type: object
      required: [schema_version, project, environment, resources]
      properties:
        schema_version:
          type: string
          const: midnight.environment-resources/v1alpha1
        project:
          type: object
          required: [id, slug, display_name]
          properties:
            id: {type: string}
            slug: {type: string}
            display_name: {type: string}
        environment:
          type: object
          required: [id, project_id, slug, name, tier, is_protected]
          properties:
            id: {type: string}
            project_id: {type: string}
            slug: {type: string}
            name: {type: string}
            tier: {type: string}
            is_protected: {type: boolean}
        resources:
          type: array
          items:
            type: object
            required: [service, private_endpoint]
            properties:
              service:
                type: object
                required: [id, project_id, slug, display_name]
