  /auth/claim:
    post:
      summary: Claim the migration default workspace and create its first human administrator.
      tags: ["Operator", "Identity"]
      description: >
        One-shot operator-recovery operation. A valid TOTP enrollment secret and first code are required; password and TOTP material are never returned. The claimed owner becomes the first installation administrator; its human session can use the globally scoped console routes as well as the tenant-scoped product routes documented with `HumanSession`. Coordinated project and service creation, ordinary unprotected environment creation, tenant-safe service/environment configuration, narrow digest-pinned image deployment, and project automation-token and invitation management are enabled human mutations; other product mutations remain operator-only.

      operationId: claimDefaultWorkspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"display_name": "example-display-name", "email": "operator@example.com", "password": "example-password", "totp_code": "example-totp-code", "totp_secret": "redacted-example", "workspace_display_name": "example-workspace-display-name", "workspace_slug": "demo"}
