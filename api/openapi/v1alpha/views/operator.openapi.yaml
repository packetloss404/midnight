                  id: {type: string}
                  project_id: {type: string}
                  slug: {type: string}
                  display_name: {type: string}
              latest_deployment:
                $ref: '#/components/schemas/EnvironmentDeploymentSummary'
              active_deployment:
                $ref: '#/components/schemas/EnvironmentDeploymentSummary'
              source:
