        Reads only the exact durable installation assignment and repository grants for the requested workspace. This is an installation-wide recovery surface and never accepts a human session.

      operationId: getGitHubInstallationWorkspaceGrant
      parameters:
        - $ref: '#/components/parameters/GitHubInstallationID'
        - $ref: '#/components/parameters/WorkspaceIDQuery'
      responses:
        '200':
          description: Exact durable installation and repository grant set.
          content:
