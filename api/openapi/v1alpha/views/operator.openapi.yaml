                  root_directory: {type: string}
                  config_path: {type: string}
                  wait_for_ci: {type: boolean}
                  required_checks:
                    type: array
                    items: {type: string}
                  auto_deploy: {type: boolean}
                  verified_at: {type: string, format: date-time}
                  updated_at: {type: string, format: date-time}
                  truth_source:
                    type: string
                    enum: [canonical-github-link, canonical-source-link, canonical-deployment]
              endpoint:
                type: object
                required: [deployment_id, tls, evidence_at]
                properties:
                  deployment_id: {type: string}
                  host: {type: string}
                  url: {type: string, format: uri}
                  tls: {type: boolean}
                  evidence_at: {type: string, format: date-time}
              private_endpoint:
                type: object
                required: [host, truth_source]
                properties:
                  host: {type: string}
                  truth_source:
                    type: string
                    enum: [derived-service-dns]
    ProjectAutomationTokenProfile:
      type: string
      enum: [ci-deploy-v1]
      description: >
        Immutable server-owned capability profile. `ci-deploy-v1` is limited to the documented project discovery, deploy/up intake, deployment status, and canonical deployment-linked operation read routes. It conveys no operator, GraphQL, MCP, management, cancellation, or deployment-action authority.

    ProjectAutomationToken:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - workspace_id
        - project_id
        - name
        - token_prefix
        - profile
        - created_at
        - updated_at
        - expires_at
        - resource_version
      properties:
        id:
          type: string
          pattern: '^tok_'
        service_account_id:
          type: string
          pattern: '^sa_'
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        name:
          type: string
          minLength: 1
          maxLength: 128
        token_prefix:
          type: string
          pattern: '^midn_sa_'
          description: Non-secret recognition prefix; it cannot authenticate a request.
        profile:
          $ref: '#/components/schemas/ProjectAutomationTokenProfile'
        created_by_user_id:
          type: string
          pattern: '^usr_'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revoked_by_user_id:
          type: string
          pattern: '^usr_'
        revoked_reason:
          type: string
        resource_version:
          type: integer
          format: int64
          minimum: 1
    ProjectAutomationTokenList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAutomationToken'
    ProjectAutomationTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [name, expires_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expires_at:
          type: string
          format: date-time
          description: Required absolute expiry; it must be in the future.
    ProjectAutomationTokenCreateResult:
      type: object
      additionalProperties: false
      required: [access_token, token]
      properties:
        access_token:
          type: string
          pattern: '^midn_sa_[A-Za-z0-9_-]+$'
          readOnly: true
          description: Raw bearer returned exactly once; it is never listable or recoverable.
        token:
          $ref: '#/components/schemas/ProjectAutomationToken'
    APIToken:
      type: string
      pattern: '^midn_(admin|user|sa|agent|mcp)_[A-Za-z0-9_-]+$'
      description: Public API token format with explicit token class.
    TokenClass:
      type: string
      enum: [admin, user, sa, agent, mcp]
    AuthBootstrapRequest:
      type: object
      required: [token_class]
      properties:
        token_class:
          $ref: '#/components/schemas/TokenClass'
    AuthBootstrapResponse:
      type: object
      required: [token, token_class]
      properties:
        token:
          $ref: '#/components/schemas/APIToken'
        token_class:
          $ref: '#/components/schemas/TokenClass'
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, docs_url]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        docs_url:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      description: >
        RFC 9457 problem details. The nested `error` member is a deprecated v1alpha compatibility extension and is omitted from the stable v1 representation.

      additionalProperties: false
      required: [type, title, status, detail, code, request_id, docs_url, error]
      properties:
        type:
          type: string
          format: uri
          description: Dereferenceable documentation URI for this failure code.
        title:
          type: string
          description: Stable failure-code title.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          enum: [INTERNAL_ERROR, NOT_IMPLEMENTED, CAPABILITY_UNAVAILABLE, AGENT_NOT_CONFIGURED, METHOD_NOT_ALLOWED, OPERATION_NOT_FOUND, OPERATION_INVALID_TRANSITION, CURSOR_INVALID, PAGINATION_LIMIT_EXCEEDED, AUTH_TOKEN_HEADER_INVALID, AUTH_REQUIRED_MISSING, AUTH_CREDENTIALS_INVALID, AUTH_SESSION_INVALID, AUTHORIZATION_DENIED, AUTH_RATE_LIMITED, INVITATION_ACCOUNT_EXISTS, AUTH_OPERATOR_RECOVERY_REQUIRED, REQUEST_RATE_LIMITED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY, IDEMPOTENCY_REQUEST_IN_PROGRESS, RESOURCE_NOT_FOUND, RESOURCE_VALIDATION_FAILED, RESOURCE_CONFLICT, PRECONDITION_REQUIRED, PRECONDITION_FAILED, SOURCE_ARTIFACT_QUOTA_EXCEEDED, SOURCE_ARTIFACT_UPLOAD_BACKPRESSURE, BACKUP_OFFHOST_MISSING, BACKUP_DESTINATION_WRITE_FAILED, RESTORE_PLAN_SERIALIZATION_FAILED, DEPLOY_JOB_ENQUEUE_FAILED, DEPLOY_SOURCE_REF_UNSUPPORTED, DEPLOY_CANCEL_QUEUE_UNAVAILABLE, DEPLOY_CANCEL_UNSAFE, LOG_QUERY_INVALID, LOG_STORE_UNAVAILABLE, MFA_REQUIRED, MFA_INVALID_CODE, VOLUME_ATTACHED, SERVICE_DELETE_RUNNING, SERVICE_DELETE_BLOCKED, VOLUME_RESIZE_DOWN_UNSUPPORTED, VERSION_SKEW_REJECTED, AGENT_CLOCK_SKEW, AGENT_HEARTBEAT_REPLAY, AGENT_HEARTBEAT_EXPIRED, AGENT_HEARTBEAT_TAMPERED, AGENT_STATUS_REPORT_REPLAY, AGENT_STATUS_REPORT_EXPIRED, AGENT_STATUS_REPORT_TAMPERED]
        request_id:
          type: string
        docs_url:
          type: string
          format: uri
        details:
          type: object
          additionalProperties: true
        error:
          deprecated: true
          x-stable-v1-omit: true
          $ref: '#/components/schemas/ErrorEnvelope'
    Compatibility:
