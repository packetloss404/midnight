components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: installation administrator bearer
      description: >
        Installation-administrator authentication for globally scoped product and control-plane APIs. Normal operation uses an expiring, revocable midn_user_* session whose current user has `instance_admin: true`. The separately configured operator-recovery credential remains a break-glass alternative and is required for the one-shot initial workspace claim. Arbitrary legacy operator strings and midn_admin_* remain recovery-compatible; midn_sa_*, midn_agent_*, and midn_mcp_* credentials are rejected.

      x-credential-class: installation-admin
    HumanSession:
      type: http
      scheme: bearer
      bearerFormat: midn_user_*
      description: >
        Expiring and revocable human dashboard/CLI session. It is accepted by identity and membership endpoints plus the explicitly documented tenant-scoped product routes. Coordinated project and service creation, ordinary unprotected environment creation, narrow digest-pinned image deployment, and project automation-token and invitation management are enabled human product mutations. Exact service/environment configuration reads and compare-and-swap writes are admitted through current `service.read`/`service.write` authority and the restricted-environment deny overlay. Exact service/environment variable metadata reads and encrypted create/rotate/tombstone operations require current `variables.read`/ `variables.write` through the restricted-environment deny overlay. Values remain write-only, and saving desired state does not deploy or restart a workload. Project-scoped GitHub repository/branch discovery and canonical service source-link GET/PUT/DELETE are also admitted through current session, membership, capability, and exact workspace-grant checks. Canonical deployment and exact operation progress reads are enabled only through current tenant grants; global GitHub installation discovery, workspace grant recovery, and other control-plane routes remain unavailable to ordinary human sessions. A user with `instance_admin: true` may also use the globally secured `BearerAuth` operations with this same session.

      x-credential-class: human-session
    ProjectAutomationToken:
      type: http
      scheme: bearer
      bearerFormat: midn_sa_*
      description: >
        Expiring and revocable service-account credential bound to one canonical workspace and project. The server-owned `ci-deploy-v1` profile accepts only the operations that explicitly list this scheme: own-project discovery, deploy/up intake, deployment reads, and reads of operations linked to a canonical deployment in the same project. It is rejected by operator, management, GraphQL, MCP, cancellation, failure, configuration, variables, and deployment-action routes.

      x-credential-class: project-automation
    AgentCredential:
      type: http
      scheme: bearer
      bearerFormat: per-agent secret
      description: >
        Installation-managed credential scoped to exactly one runtime agent. For item routes, the credential must match the `{id}` path parameter; registration binds it to the `agent_id` request field. An optional `X-Midnight-Agent-ID` header must agree with that same identity. Operator recovery, human-session, and project-automation credentials are never accepted by these routes.

      x-credential-class: runtime-agent
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: >
        GitHub HMAC-SHA256 signature over the exact request body. This scheme applies only when the provider path parameter is `github`.

    MidnightWebhookSignature:
      type: apiKey
      in: header
      name: Midnight-Signature
      description: >
        Midnight timestamped HMAC signature (`t=<unix>,v1=<hex>,kid=<id>`) over the exact request body. This scheme applies to the non-GitHub inbound providers.

  responses:
    BadRequest:
      description: Request parameters or body are invalid (`RESOURCE_VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token (`AUTH_REQUIRED_MISSING`, `AUTH_TOKEN_HEADER_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HumanUnauthorized:
      description: Invalid credentials, missing MFA, or an invalid/expired/revoked human session (`AUTH_CREDENTIALS_INVALID`, `MFA_REQUIRED`, `MFA_INVALID_CODE`, `AUTH_SESSION_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProductUnauthorized:
      description: Missing/invalid operator or project-automation credential, or invalid/expired/revoked human session (`AUTH_REQUIRED_MISSING`, `AUTH_TOKEN_HEADER_INVALID`, `AUTH_SESSION_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated principal lacks the required capability (`AUTHORIZATION_DENIED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found (`RESOURCE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The supplied strong If-Match validator is stale, malformed, weak, or does not match the current resource (`PRECONDITION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A strong If-Match validator from the authoritative item GET is required (`PRECONDITION_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current state or idempotency history.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The proposed resource is understood but cannot be validated or executed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required durable authority or runtime dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag returned by the authoritative GET for this exact resource. Weak, malformed, stale, and wildcard validators are rejected.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ChangesetIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong changeset revision validator. The initial create uses "0".
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
    TopologyIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong topology-layout version validator. The initial create uses "0".
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
    AgentConversationID:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AgentConversationProjectFilter:
      name: project_id
      in: query
      required: false
      description: Restrict conversations to one exact project identifier.
      schema:
        type: string
        minLength: 1
    AgentConversationServiceFilter:
      name: service_id
      in: query
      required: false
      description: Restrict conversations to one exact service identifier.
      schema:
        type: string
        minLength: 1
    AgentConversationActorFilter:
      name: actor_id
      in: query
      required: false
      description: Restrict conversations to one exact actor identifier.
      schema:
        type: string
        minLength: 1
    AgentMessageOrder:
      name: order
      in: query
      required: false
      description: Sequence-number ordering. The value is bound into returned cursors.
      schema:
        type: string
        enum: [asc, desc]
    OperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ses_'
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^wrk_'
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^prj_'
    ServiceID:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^svc_'
    EnvironmentID:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^env_'
    VariableID:
      name: variable_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^(var_|sealed_)'
    TenantGeneratedDomainID:
      name: domain_id
      in: path
      required: true
      description: Opaque generated-domain identifier from the exact nested service/environment collection.
      schema:
        type: string
        pattern: '^dom_'
    GitHubInstallationID:
      name: installation_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GitHubRepositoryID:
      name: repository_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceIDQuery:
      name: workspace_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    AutomationTokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^tok_'
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^usr_'
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^inv_'
    InvitationWorkspaceIDQuery:
      name: workspace_id
      in: query
      required: true
      schema:
        type: string
        pattern: '^wrk_'
    InvitationProjectIDQuery:
      name: project_id
      in: query
      required: false
      schema:
        type: string
        pattern: '^prj_'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantVariableIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Stable opaque retry identity for one exact nested variable mutation. Send exactly one non-blank physical header field. Missing, repeated, or proxy-coalesced values are rejected before an idempotency identity is selected. An exact replay revalidates the current human session and tenant authority before returning stored response bytes.

      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantGeneratedDomainIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Stable opaque retry identity for one exact nested generated-domain mutation. Send exactly one non-blank physical header field. Missing, repeated, or proxy-coalesced values are rejected before an idempotency identity is selected. Exact replay revalidates the current human session and tenant authority before returning stored response bytes.

      schema:
        type: string
        minLength: 1
        maxLength: 255
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in one page. Defaults to 50 and is bound into any returned cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque, expiring, integrity-protected keyset cursor. It is bound to the authenticated actor, tenant, collection, filters, ordering, and page size and cannot be reused with a different query.

      schema:
        type: string
        minLength: 1
    DeploymentEnvironmentFilter:
      name: environment_id
      in: query
      required: false
      description: >
        Restrict a canonical deployment read to one exact environment. An empty or repeated value is rejected. Tenant authorization and restricted-environment concealment still apply.

      schema:
        type: string
        minLength: 1
    DeploymentPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in this bounded deployment page. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DeploymentPageCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque signed continuation cursor returned as `next_cursor`. The cursor is bound to the exact service and environment filter and is rejected if modified or reused for another scope.

      schema:
        type: string
        minLength: 1
    OperationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OperationState'
    OperationKindFilter:
      name: kind
      in: query
      required: false
      schema:
        type: string
    OperationEventsAfter:
      name: after
      in: query
      required: false
      description: Return only operation events with `seq` greater than this non-negative sequence cursor.
      schema:
        type: integer
        minimum: 0
    OperationEventsStream:
      name: stream
      in: query
      required: false
      description: Set to `sse` to replay durable history and then follow live operation events.
      schema:
        type: string
        enum: [sse]
    OperationEventsLastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >
        Resume after this monotonic event sequence. Takes precedence over the `after` query parameter when both are present.

      schema:
        type: integer
        minimum: 0
    PathID:
      name: id
      in: path
      required: true
      description: Resource identifier (`<prefix>_<opaque>`).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    TemplateSlug:
      name: slug
      in: path
      required: true
      description: Built-in template slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ServiceProjectFilter:
      name: project_id
      in: query
      required: false
      description: >
        Restrict the service list to children of the named project. Exactly one project_id is required when authenticating with ProjectAutomationToken.

      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    AgentRegistrationRequest:
      type: object
      additionalProperties: false
      required: [agent_id, version]
      properties:
        agent_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time
    AgentRegistrationResponse:
      type: object
      additionalProperties: false
      required: [agent_id, heartbeat_interval]
      properties:
        agent_id:
          type: string
        heartbeat_interval:
          type: integer
          format: int64
          minimum: 1
          description: Heartbeat interval encoded as nanoseconds by the Go wire DTO.
        desired_state_url:
          type: string
    AgentHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [sequence, sent_at, hmac]
      properties:
        agent_id:
          type: string
          description: When present, must equal the authenticated path agent ID.
        sequence:
          type: integer
          minimum: 1
        status:
          type: string
        runtime:
          type: string
        sent_at:
          type: string
          format: date-time
        maintenance_mode:
          type: boolean
        drain_mode:
          type: boolean
        hmac:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
    AgentHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [accepted_sequence]
      properties:
        accepted_sequence:
          type: integer
          minimum: 1
        desired_state_etag:
          type: string
        warmup_active:
          type: boolean
    AgentInstanceStatus:
      type: object
      additionalProperties: false
      properties:
        deployment_id: {type: string}
        instance_id: {type: string}
        state: {type: string}
        observed_at: {type: string, format: date-time}
        reason: {type: string}
    AgentRouteTargetObservation:
      type: object
      additionalProperties: false
      properties:
        project_id: {type: string}
        environment_id: {type: string}
        route_id: {type: string}
        route_name: {type: string}
        deployment_id: {type: string}
        instance_id: {type: string}
        container_id: {type: string}
        container_name: {type: string}
        container_ip: {type: string}
        target_protocol: {type: string}
        internal_service_port: {type: integer}
        mapped_host_port: {type: integer}
        readiness_status: {type: string}
        last_observed_at: {type: string, format: date-time}
    AgentRuntimeDrift:
      type: object
      additionalProperties: false
      properties:
        api_version: {type: string}
        engine_version: {type: string}
        storage_driver: {type: string}
        live_restore: {type: boolean}
        logging_driver: {type: string}
        no_new_privileges: {type: boolean}
        cgroup_version: {type: string}
        baseline_conflicts:
          type: array
          items: {type: string}
    AgentStatusReport:
      type: object
      additionalProperties: false
      required: [agent_id, sequence, observed_at, hmac]
      properties:
        agent_id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 1
        observed_at:
          type: string
          format: date-time
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstanceStatus'
        route_targets:
          type: array
          items:
            $ref: '#/components/schemas/AgentRouteTargetObservation'
        drift:
          $ref: '#/components/schemas/AgentRuntimeDrift'
        hmac:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
    AgentStatusReportResponse:
      type: object
      additionalProperties: false
      required: [accepted_at]
      properties:
        accepted_at:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, project_id, slug, name, tier, is_protected, resource_version, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque environment identifier (`env_*`).
        project_id:
          type: string
          description: Owning project identifier (`prj_*`).
        slug:
          type: string
        name:
          type: string
        tier:
          type: string
        is_protected:
          type: boolean
        resource_version:
          type: integer
          format: int64
          minimum: 1
          description: Positive metadata version used by exact compare-and-swap updates.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvironmentChangesetCapability:
      type: object
      additionalProperties: false
      required: [kind, supported]
      properties:
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        supported: {type: boolean}
        reason: {type: string}
    EnvironmentChangesetItem:
      type: object
      additionalProperties: false
      required: [id, kind, operation, service_id, name, value_change]
      properties:
        id: {type: string}
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        operation: {type: string, enum: [add, edit, remove]}
        service_id: {type: string}
        target_id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [plain, secret, sealed]}
        expected_version: {type: integer, format: int64, minimum: 1}
        value_change:
          type: string
          description: Redaction-safe change description; variable plaintext is never returned.
        runtime: {$ref: '#/components/schemas/EnvironmentRuntimeSpec'}
        networking: {$ref: '#/components/schemas/EnvironmentNetworkingSpec'}
        storage: {$ref: '#/components/schemas/EnvironmentStorageSpec'}
    EnvironmentChangeset:
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, environment_id, created_by, state, revision, items, created_at, updated_at]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        project_id: {type: string}
        environment_id: {type: string}
        created_by: {type: string}
        note: {type: string, maxLength: 500}
        state: {type: string, enum: [draft, applied, discarded]}
        revision: {type: integer, format: int64, minimum: 1}
        applied_revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic environment configuration revision assigned when this changeset applied.
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetItem'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        applied_at: {type: string, format: date-time}
        discarded_at: {type: string, format: date-time}
    EnvironmentChangesetValidation:
      type: object
      additionalProperties: false
      required: [valid, affected_services, affected_resources, errors, warnings]
      properties:
        valid: {type: boolean}
        affected_services: {type: array, items: {type: string}}
        affected_resources:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentAffectedResource'}
        errors: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
    EnvironmentAffectedResource:
      type: object
      additionalProperties: false
      required: [service_id, resource_kinds, requires_deploy, deployment_action]
      properties:
        service_id: {type: string}
        resource_kinds:
          type: array
          uniqueItems: true
          items: {type: string, enum: [variable, networking, runtime, storage]}
        requires_deploy:
          type: boolean
          example: true
          description: Server-derived deployment necessity; clients must not infer this from timestamps.
        deployment_action:
          type: string
          enum: [none, redeploy, rebuild]
          example: redeploy
          description: Server-derived highest-impact action for this service. Rebuild is selected only when normalized build inputs actually changed; redeploy reuses an immutable image; none requires no rollout.
    EnvironmentServiceConfigurationRevision:
      type: object
      additionalProperties: false
      required: [service_id, applied_revision, deployed_revision, deployment_required]
      properties:
        service_id: {type: string}
        applied_revision: {type: integer, format: int64, minimum: 0}
        deployed_revision: {type: integer, format: int64, minimum: 0}
        deployment_required: {type: boolean}
        deployed_deployment_id: {type: string}
        pending_deployment_id: {type: string}
    EnvironmentConfigurationState:
      type: object
      additionalProperties: false
      required: [applied_revision, services]
      properties:
        applied_revision: {type: integer, format: int64, minimum: 0}
        services:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentServiceConfigurationRevision'}
    EnvironmentChangesetView:
      type: object
      additionalProperties: false
      required: [validation, capabilities]
      properties:
        changeset:
          nullable: true
          allOf: [{$ref: '#/components/schemas/EnvironmentChangeset'}]
        validation: {$ref: '#/components/schemas/EnvironmentChangesetValidation'}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentChangesetCapability'}
        configuration_state: {$ref: '#/components/schemas/EnvironmentConfigurationState'}
    EnvironmentOperationGroupItem:
      type: object
      additionalProperties: false
      required: [service_id, resource_kinds, requires_deploy, deployment_action, intake_state]
      properties:
        service_id: {type: string}
        resource_kinds:
          type: array
          items: {type: string, enum: [variable, networking, runtime, storage]}
        requires_deploy: {type: boolean, example: true}
        deployment_action: {type: string, enum: [none, redeploy, rebuild], example: redeploy}
        intake_state: {type: string, enum: [not_required, queued, failed], example: queued}
        deployment_id: {type: string}
        operation_id: {type: string}
        operation_state: {$ref: '#/components/schemas/OperationState'}
        deployment_state:
          type: string
          enum: [queued, building, deploying, active, superseded, failed, canceled]
        failure_code: {type: string}
        failure_reason: {type: string}
    EnvironmentOperationGroup:
      type: object
      additionalProperties: false
      required: [id, environment_id, changeset_id, configuration_revision, state, items, created_at]
      properties:
        id: {type: string, pattern: '^opg_'}
        environment_id: {type: string}
        changeset_id: {type: string}
        configuration_revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [accepted, partial, running, succeeded, failed]}
        items:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentOperationGroupItem'}
        created_at: {type: string, format: date-time}
    EnvironmentApplyAndDeployResponse:
      type: object
      additionalProperties: false
      required: [applied_revision, operation_group_id, affected_services, changeset, validation, operation_group]
      properties:
        applied_revision: {type: integer, format: int64, minimum: 1}
        operation_group_id: {type: string, pattern: '^opg_'}
        affected_services: {type: array, items: {type: string}}
        changeset: {$ref: '#/components/schemas/EnvironmentChangeset'}
        validation: {$ref: '#/components/schemas/EnvironmentChangesetValidation'}
        operation_group: {$ref: '#/components/schemas/EnvironmentOperationGroup'}
    EnvironmentChangesetInput:
      type: object
      additionalProperties: false
      required: [kind, operation, service_id, name]
      properties:
        kind: {type: string, enum: [variable, networking, runtime, storage]}
        operation: {type: string, enum: [add, edit, remove]}
        service_id: {type: string}
        target_id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [plain, secret, sealed]}
        expected_version: {type: integer, format: int64, minimum: 1}
        value:
          type: string
          writeOnly: true
          description: Encrypted before persistence and never returned.
        runtime: {$ref: '#/components/schemas/EnvironmentRuntimeSpec'}
        networking: {$ref: '#/components/schemas/EnvironmentNetworkingSpec'}
        storage: {$ref: '#/components/schemas/EnvironmentStorageSpec'}
    EnvironmentRuntimeSpec:
      type: object
      additionalProperties: false
      properties:
        root_directory: {type: string, maxLength: 1024}
        builder: {type: string, enum: [auto, dockerfile, railpack]}
        dockerfile_path: {type: string, maxLength: 1024}
        build_command: {type: string, maxLength: 32768}
        start_command: {type: string, maxLength: 32768}
        predeploy_command: {type: string, maxLength: 32768}
        target_port: {type: integer, minimum: 0, maximum: 65535}
        health_kind: {type: string, enum: [none, http, tcp]}
        health_path: {type: string, maxLength: 2048}
        health_port: {type: integer, minimum: 0, maximum: 65535}
        health_timeout_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
        health_interval_seconds: {type: integer, format: int64, minimum: 0, maximum: 86399}
        restart_policy: {type: string, enum: [no, always, unless-stopped, on-failure]}
        restart_retries: {type: integer, minimum: 0, maximum: 1000}
        replicas: {type: integer, minimum: 0, maximum: 50}
        overlap_enabled: {type: boolean}
        drain_grace_seconds: {type: integer, format: int64, minimum: 0, maximum: 3600}
        runtime_kind: {type: string, enum: [service, background, cron]}
        cron_schedule: {type: string}
        cron_timeout_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
        cron_max_attempts: {type: integer, minimum: 0, maximum: 10}
        cron_retry_delay_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400}
    EnvironmentNetworkingSpec:
      type: object
      additionalProperties: false
      required: [kind, public]
      properties:
        kind: {type: string, const: generated}
        public: {type: boolean, const: true}
    EnvironmentStorageSpec:
      type: object
      additionalProperties: false
      required: [size_bytes, mount_path]
      properties:
        size_bytes: {type: integer, format: int64, minimum: 0}
        mount_path: {type: string, pattern: '^/[^/].*'}
    PutEnvironmentChangesetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, changes]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        note: {type: string, maxLength: 500}
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetInput'}
    TransitionEnvironmentChangesetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
    ConfigSyncDocument:
      type: object
      additionalProperties: false
      required: [api_version, environment_id, expected_revision, changes]
      properties:
        api_version: {type: string, const: midnight/v1alpha}
        environment_id: {type: string}
        expected_revision: {type: integer, format: int64, minimum: 0}
        note: {type: string, maxLength: 500}
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/EnvironmentChangesetInput'}
    EnvironmentMutationRequest:
      type: object
      properties:
        project_id:
          type: string
        slug:
          type: string
          minLength: 1
        name:
          type: string
        tier:
          type: string
          enum: [production, staging, preview, development]
        is_protected:
          type: boolean
          description: >
            Shared operator lifecycle field. On `POST /environments`, HumanSession callers must omit this property or set it to `false`; `true` is rejected with 403 because protected creation is recovery-operator-only.

        copy_config:
          type: boolean
          description: >
            Transactionally copy per-service configuration, active encrypted variables, and immutable encrypted variable versions. Ciphertext is re-encrypted under fresh variable IDs; plaintext is never returned. Requires Idempotency-Key and the durable Postgres adapter.

        copy_domains:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; domain names and route publication must be created explicitly.
        copy_volumes:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; persistent data must be provisioned or restored explicitly.
        copy_deployments:
          type: boolean
          description: Unsupported. `true` is rejected with RESOURCE_VALIDATION_FAILED; history and running instances remain bound to the source environment.
