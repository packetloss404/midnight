          type: boolean
    TemplateVolume:
      type: object
      required: [name, mount_path, size_bytes]
      properties:
        name:
          type: string
        mount_path:
          type: string
          pattern: '^/'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    TemplateDeployRequest:
      type: object
