        - template_slug
        - state
        - environment_id
        - deployment_id
        - created_services
        - status_url
      description: >
        Durable intake acknowledgement. `state=queued` is not database success; follow status_url until terminal.

      properties:
        operation_id:
          type: string
        provision_run_id:
          type: string
        template_slug:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        environment_id:
          type: string
        deployment_id:
          type: string
        created_services:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedService'
        created_variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedResource'
        created_volumes:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCreatedResource'
        note:
          type: string
        status_url:
          type: string
    TemplateProvisionRun:
      type: object
      required:
        - id
        - template_slug
        - project_id
        - environment_id
        - service_id
        - volume_id
        - operation_id
        - deployment_id
        - state
        - connectivity_verified
        - persistence_verified
        - cleanup_completed
      properties:
        id:
          type: string
        template_slug:
          type: string
          enum: [postgres, redis, mysql, mongodb]
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        volume_id:
          type: string
        operation_id:
          type: string
        deployment_id:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        connectivity_verified:
          type: boolean
        persistence_verified:
          type: boolean
        cleanup_completed:
          type: boolean
        write_probe_container_id:
          type: string
        read_probe_container_id:
          type: string
        marker_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        failure_code:
          type: string
        failure_reason:
          type: string
          maxLength: 512
    DomainRoute:
      type: object
      required: [id, name, path_prefix, target_port, public]
      properties:
        id:
          type: string
        name:
          type: string
        path_prefix:
          type: string
          pattern: '^/'
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
        public:
          type: boolean
    DomainDNSChallenge:
      type: object
      required: [record_name, record_value, state, attempts]
      properties:
        record_name:
          type: string
        record_value:
          type: string
        state:
          type: string
          enum: [pending, verified, failed]
        attempts:
          type: integer
          format: int64
        last_error:
          type: string
        checked_at:
          type: string
          format: date-time
    DomainCertificate:
      type: object
      required: [issuer, state]
      properties:
        issuer:
          type: string
          description: "`unconfigured` until an operator wires a certificate issuer."
        state:
          type: string
          enum: [pending, issuing, ready, failed]
        expires_at:
          type: string
          format: date-time
        last_error:
          type: string
    Domain:
      type: object
      required: [id, project_id, environment_id, service_id, kind, hostname, tls_desired, tls_state, apply_state, reachable, routes, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        kind:
          type: string
          enum: [generated, custom]
        hostname:
          type: string
        tls_desired:
          type: boolean
        tls_state:
          type: string
          enum: [disabled, unavailable, ready]
        apply_state:
          type: string
          enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]
        reachable:
          type: boolean
          description: True only with durable Traefik acknowledgement and successful trusted-ingress probe evidence.
        artifact_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        error_code:
          type: string
        error_detail:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/DomainRoute'
        dns_challenge:
          $ref: '#/components/schemas/DomainDNSChallenge'
        certificate:
          $ref: '#/components/schemas/DomainCertificate'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateDomainRequest:
      type: object
      required: [project_id, environment_id, service_id, kind, public, tls]
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        kind:
          type: string
          enum: [generated, custom]
        hostname:
          type: string
          description: Required for custom domains; omitted for generated domains.
        path_prefix:
          type: string
          default: /
          pattern: '^/'
        target_port:
          type: integer
          default: 8080
          minimum: 1
          maximum: 65535
        public:
          type: boolean
          default: false
        tls:
          type: boolean
          default: false
    TCPProxy:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - service_id
        - hostname
        - external_port
        - public_address
        - backend_port
        - allowed_source_cidrs
        - desired_enabled
        - apply_state
        - listener_bound
        - backend_reachable
        - dns_provisioned
        - public_reachability_verified
        - created_at
        - updated_at
      description: >
        Durable desired state plus single-host listener/backend evidence. DNS and public reachability are separate, operator-owned facts and are never inferred from an active local listener.

      properties:
        id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        hostname:
          type: string
        external_port:
          type: integer
          minimum: 1024
          maximum: 65535
        public_address:
          type: string
        backend_port:
          type: integer
          minimum: 1
          maximum: 65535
        allowed_source_cidrs:
          type: array
          description: >
            CIDRs matched against the peer address observed by the listener. An empty array means unrestricted/public. Docker bridge NAT may present a gateway address instead of the original client.

          items:
            type: string
        desired_enabled:
          type: boolean
        apply_state:
          type: string
          enum: [pending, active, withdrawn, failed]
        listener_bound:
          type: boolean
        backend_reachable:
          type: boolean
        dns_provisioned:
          type: boolean
          const: false
          description: DNS mutation is not part of the executable single-host slice.
        public_reachability_verified:
          type: boolean
          const: false
          description: External firewall/NAT and internet reachability are not probed.
        controller_id:
          type: string
        error_code:
          type: string
        error_detail:
          type: string
        observed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTCPProxyRequest:
      type: object
      required:
        - project_id
        - environment_id
        - service_id
        - backend_port
      properties:
        project_id:
          type: string
        environment_id:
          type: string
        service_id:
          type: string
        hostname:
          type: string
          description: Optional descriptive hostname. Omit to use the configured TCP base domain.
        external_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Optional port request; omit or use zero for collision-safe allocation.
        backend_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Internal port on the ready active deployment selected server-side.
        allowed_source_cidrs:
          type: array
          uniqueItems: true
          default: []
          description: >
            Optional CIDRs matched against the peer address observed by the listener. Omit or use an empty array for unrestricted/public TCP. Docker bridge NAT may replace the original client address.

          items:
            type: string
    Volume:
