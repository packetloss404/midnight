  /auth/password-reset:
    post:
      summary: Reset an installation administrator's password and second factor.
      tags: ["Operator", "Identity"]
      description: >
        Operator-recovery credential reset. `/auth/claim` is one-shot, so without this operation a lost or mistyped first-run password leaves a claimed installation unreachable by any human. It accepts only the installation recovery credential: a signed-in administrator session is refused with `AUTH_OPERATOR_RECOVERY_REQUIRED`, because rewriting another account's password and second factor is not a capability any human session should carry.


        The target must be an enabled, undeleted installation administrator; disabled and soft-deleted accounts are never resurrected by recovery. The second factor is never silently dropped: either supply a verified replacement enrollment (`totp_secret` plus its current `totp_code`, checked exactly the way `/auth/claim` checks a first enrollment), or set `preserve_totp` to keep the authenticator the account already has. A successful reset clears any pending password-rotation requirement, invalidates the account's session generation, and revokes every live session, so a stolen session cannot outlive the recovery. Password and TOTP material are never returned.

      operationId: resetAdministratorPassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: {"email": "operator@example.com", "password": "example-password", "totp_code": "example-totp-code", "totp_secret": "redacted-example"}
              $ref: '#/components/schemas/IdentityPasswordResetRequest'
      responses:
