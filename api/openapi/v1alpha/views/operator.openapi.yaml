    TenantCustomDomain:
      type: object
      additionalProperties: false
      required: [id, workspace_id, project_id, service_id, environment_id, kind, hostname, path, target_port, public, tls, version, ownership_state, route_apply_state, route_reachable, routing_dns, dns_challenge, created_at, updated_at]
      description: >
        Tenant-scoped custom hostname. `ownership_state` is exact TXT evidence only; `route_reachable` is local trusted-ingress evidence and does not prove public DNS, Internet reachability, or a certificate.

      properties:
        id: {type: string, pattern: '^dom_'}
        workspace_id: {type: string, pattern: '^wrk_'}
        project_id: {type: string, pattern: '^prj_'}
        service_id: {type: string, pattern: '^svc_'}
        environment_id: {type: string, pattern: '^env_'}
        kind: {type: string, enum: [custom]}
        hostname: {type: string, minLength: 1, maxLength: 253}
        path: {type: string, enum: ['/']}
        target_port: {type: integer, minimum: 1, maximum: 65535}
        public: {type: boolean, description: True only after ownership verification and route publication intent.}
        tls: {type: boolean, description: HTTPS is requested only when true; publication remains fail-closed until certificate evidence is ready.}
        version: {type: integer, format: int64, minimum: 1}
        ownership_state: {type: string, enum: [pending, verified, failed]}
        route_apply_state: {type: string, enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]}
        route_reachable: {type: boolean}
        routing_dns:
          type: object
          additionalProperties: false
          required: [record_type, record_name, state, note]
          properties:
            record_type: {type: string, enum: [CNAME, A/ALIAS/ANAME]}
            record_name: {type: string}
            record_value: {type: string}
            state: {type: string, enum: [operator_required, unavailable, configured, invalid]}
            note: {type: string}
        dns_challenge:
          type: object
          additionalProperties: false
          required: [record_name, record_value, state, attempts]
          properties:
            record_name: {type: string}
            record_value: {type: string}
            state: {type: string, enum: [pending, verified, failed]}
            attempts: {type: integer, format: int64, minimum: 0}
            checked_at: {type: [string, 'null'], format: date-time}
            verified_at: {type: [string, 'null'], format: date-time}
            last_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
