      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: {type: string, minLength: 1, maxLength: 253}
        tls: {type: boolean, default: false, description: Request HTTPS certificate lifecycle for this custom hostname.}
    TenantGeneratedDomain:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - project_id
        - service_id
        - environment_id
        - kind
        - hostname
        - path
        - target_port
        - public
        - tls
        - version
        - route_apply_state
        - route_reachable
        - created_at
        - updated_at
      description: >
        Strict HumanSession generated-HTTP projection. Hostname and route fields express durable desired state plus trusted-ingress evidence; they do not expose custom-domain ownership, certificate material, controller diagnostics, backend addresses, public-DNS proof, or Internet reachability.

      properties:
        id:
          type: string
          pattern: '^dom_'
        workspace_id:
          type: string
          pattern: '^wrk_'
        project_id:
          type: string
          pattern: '^prj_'
        service_id:
          type: string
          pattern: '^svc_'
        environment_id:
          type: string
          pattern: '^env_'
        kind:
          type: string
          enum: [generated]
        hostname:
          type: string
          minLength: 1
          maxLength: 253
          description: Server-derived one-label hostname below the operator-configured apps domain.
        path:
          type: string
          enum: [/]
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Server-derived canonical service/environment target port; never caller input on this route.
        public:
          type: boolean
          enum: [true]
        tls:
          type: boolean
          enum: [false]
        version:
          type: integer
          format: int64
          minimum: 1
          description: >
            Desired-state mutation version used by delete `expected_version`; it is not a validator for the full representation because route-group evidence changes independently.

        route_apply_state:
          type: string
          enum: [pending, private, blocked_tls, blocked_backend, file_applied, ready, failed]
          description: >
            Environment route-group controller state projected onto this domain. Publication is group-atomic, so a sibling route in the same project/environment can block the group even when this generated domain's own desired shape is valid. This is not domain-local controller evidence.

        route_reachable:
          type: boolean
          description: >
            True only when this domain has a current ready backend and the environment route-group revision, publication artifact, Traefik acknowledgement, and trusted Host-header ingress-probe evidence all agree. A false value does not identify which sibling blocked the group. Not public-Internet proof.

        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantGeneratedDomainCreateRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >
        Strict empty HumanSession create body. Hostname, ownership, path, target port, visibility, custom-domain, and TLS fields are all rejected because the server derives the complete generated HTTP intent.

      properties: {}
    TenantGeneratedDomainDeleteRequest:
      type: object
      additionalProperties: false
